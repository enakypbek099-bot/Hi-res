name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web assets
        run: |
          mkdir -p www
          cp index.html sw.js manifest.json www/
          cp icon-*.png www/

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android

      - name: Native audio plugin
        run: |
          D=android/app/src/main/java/kz/enakypbek/hires
          mkdir -p "$D"
          cp native/AudioInfoPlugin.java native/MainActivity.java "$D/"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hires-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
