<style>
:root{--teal:#2ef2c3;--pink:#ff3da5;--vio:#7b2cff;--bg:#07060d;--glass:rgba(255,255,255,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;
background-image:radial-gradient(60% 40% at 85% 0%,rgba(123,44,255,.55),transparent),radial-gradient(50% 35% at 0% 30%,rgba(46,242,195,.22),transparent),radial-gradient(60% 40% at 100% 75%,rgba(255,61,165,.25),transparent);background-attachment:fixed}
main{max-width:760px;margin:0 auto;padding:18px 16px 190px}
.nav{display:flex;justify-content:space-between;font-size:.72rem;color:#cfc8e6;letter-spacing:.08em}
h1{font-family:'Russo One',Impact,sans-serif;font-weight:400;font-size:clamp(2rem,10vw,3.4rem);letter-spacing:.08em;line-height:1.05;margin:46px 0 8px}
h1 span{display:block;color:transparent;-webkit-text-stroke:1.5px var(--teal)}
.tag{font-size:.78rem;color:#d9d3ee;margin:0 0 18px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{background:var(--teal);color:#05221b;border:0;border-radius:9px;padding:11px 20px;font-weight:700;font-size:.9rem;cursor:pointer}
.up{position:relative;overflow:hidden;text-align:center;cursor:pointer}.up input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;font-size:200px;cursor:pointer}
.link{background:none;border:0;color:var(--pink);font-weight:600;cursor:pointer;font-size:.9rem}
.tabs{display:flex;gap:8px;margin:34px 0 16px}
.tab{background:rgba(255,255,255,.1);color:#ddd;border:1px solid transparent;border-radius:8px;padding:8px 16px;font-size:.82rem;cursor:pointer}
.tab.on{background:var(--pink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--glass);border:1.5px solid var(--pink);border-radius:18px;padding:10px;backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(255,61,165,.2)}
.card.cur{border-color:var(--teal);box-shadow:0 0 22px rgba(46,242,195,.45)}
.art{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.art i{width:46%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 18px rgba(255,255,255,.6),inset 0 0 14px rgba(255,255,255,.4)}
.art b{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:var(--teal);font-size:.62rem;padding:3px 7px;border-radius:6px;letter-spacing:.06em}
.name{font-weight:600;font-size:.88rem;margin:10px 2px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:.7rem;color:#b9b2d4;margin:0 2px 9px}
.acts{display:flex;gap:6px}
.acts .btn{flex:1;padding:9px 0;font-size:.82rem}
.ic{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:9px;width:38px;cursor:pointer;font-size:.95rem}
.ic.f{color:var(--pink)}
.empty{text-align:center;color:#b9b2d4;padding:40px 10px;grid-column:1/-1}
.player{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(12,9,24,.92);backdrop-filter:blur(14px);border-top:1.5px solid var(--vio)}
.pin{max-width:760px;margin:0 auto}
.pt{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.cv{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
#lb{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9;background:rgba(0,0,0,.95);align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ph img{width:44px;height:44px;border-radius:8px;object-fit:cover;display:none;flex:none}
.ph .pt{margin:0;min-width:0;flex:1}
.pc{display:flex;align-items:center;gap:10px}
.pc button{background:none;border:0;color:#fff;font-size:1.2rem;cursor:pointer}
.pc .pp{background:var(--teal);color:#05221b;width:42px;height:42px;border-radius:50%;font-size:1.1rem}
input[type=range]{flex:1;accent-color:var(--pink);min-width:0}
.tm{font-size:.7rem;color:#b9b2d4;min-width:78px;text-align:right}
.note{font-size:.78rem;color:#ffb3d9;margin:10px 0 0;min-height:1em}

button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{overflow-x:hidden;max-width:100%}
body{min-height:100dvh}
@media(max-width:480px){

h1{margin-top:34px}
.row{flex-direction:column;align-items:stretch;gap:6px}
.btn{padding:14px 20px;font-size:1rem}
.link{padding:10px;text-align:center}
.tab{flex:1;padding:12px 0;font-size:.9rem}
.grid{gap:12px}
.acts .btn{padding:12px 0}
.ic{width:44px;font-size:1.05rem}
.pc button{font-size:1.4rem;padding:6px}
.pc .pp{width:48px;height:48px}
.tm{min-width:72px}
}

.acts .btn,.pc .pp{background:linear-gradient(145deg,rgba(100,180,255,.40),rgba(40,100,230,.12));color:#eaf4ff;border:1px solid rgba(150,205,255,.65);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -8px 14px rgba(40,110,255,.2),0 0 16px rgba(70,150,255,.4)}
.acts .btn svg{vertical-align:-.14em}
.pc .pp{display:flex;align-items:center;justify-content:center;padding:0;font-size:1.5rem}

.flow{position:relative;height:calc(min(72vw,300px) + 210px);perspective:1100px;perspective-origin:50% 40%;touch-action:pan-y;overflow:hidden;user-select:none;-webkit-user-select:none;margin:0 -16px}
.flow .card{position:absolute;top:8px;left:50%;width:min(72vw,300px);margin-left:calc(min(72vw,300px) / -2);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .6s;will-change:transform,opacity;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));-webkit-box-reflect:below 8px linear-gradient(transparent 78%,rgba(255,255,255,.2))}

.cv{-webkit-user-drag:none}
.cnt{text-align:center;color:#b9b2d4;font-size:.8rem;margin-top:2px}
.empty{padding:60px 10px}

.cv{cursor:default;backface-visibility:hidden}
.ph img{background:#0c0918}
.flow .card{border:1px solid rgba(255,255,255,.3);background:linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 42%,rgba(110,170,255,.12));-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 24px rgba(120,180,255,.12),0 14px 40px rgba(0,0,0,.55),0 0 26px rgba(80,150,255,.2)}
.flow .card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;background:linear-gradient(118deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.06) 28%,rgba(255,255,255,0) 45%);pointer-events:none}
.flow .card.cur{border-color:rgba(46,242,195,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 24px rgba(46,242,195,.14),0 14px 40px rgba(0,0,0,.55),0 0 30px rgba(46,242,195,.4)}
.art{box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 8px 20px rgba(0,0,0,.5)}
.player{background:linear-gradient(180deg,rgba(45,80,160,.3),rgba(10,10,28,.88));-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid rgba(150,205,255,.45);box-shadow:0 -10px 30px rgba(60,120,255,.18)}

.flow .card{transition:none;-webkit-backdrop-filter:none;backdrop-filter:none;-webkit-box-reflect:none;will-change:transform,opacity;background:linear-gradient(155deg,rgba(95,125,205,.42),rgba(24,21,50,.86) 55%,rgba(60,100,205,.34));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 18px rgba(120,180,255,.14),0 6px 16px rgba(0,0,0,.45)}
.flow .card.cur{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 18px rgba(46,242,195,.16),0 6px 16px rgba(0,0,0,.45),0 0 18px rgba(46,242,195,.4)}
.art{box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.acts .btn{-webkit-backdrop-filter:none;backdrop-filter:none}
.player{-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}
.flow .card{backface-visibility:hidden;-webkit-backface-visibility:hidden;outline:1px solid transparent;-webkit-font-smoothing:antialiased}
.flow .card *{backface-visibility:hidden}

.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none!important;padding:10px 18px!important;white-space:nowrap}
.ph{cursor:pointer;-webkit-tap-highlight-color:transparent}
#np{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;overflow:hidden;background:#07060d;transform:translateY(100%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.8,.2,1),visibility 0s .42s}
#np.on{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.8,.2,1),visibility 0s}

#np::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;z-index:1;background:linear-gradient(180deg,rgba(7,6,13,.2),rgba(7,6,13,.88));pointer-events:none}
.npin{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 22px calc(env(safe-area-inset-bottom,0px) + 20px);max-width:560px;margin:0 auto;overflow-y:auto}
.nptop{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:#cfc8e6;letter-spacing:.12em;text-transform:uppercase}
.nptop button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:50%;width:40px;height:40px;font-size:1.3rem;cursor:pointer}
.nptop i{width:40px}
.npart{flex:none;width:min(80vw,360px);aspect-ratio:1;margin:18px 0 16px;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.18),0 0 40px rgba(80,150,255,.28);transform:scale(.86);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#np.pl .npart{transform:scale(1)}
.npart img{width:100%;height:100%;object-fit:cover;display:block}
.npbad{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.chip{font-size:.66rem;font-weight:700;letter-spacing:.07em;padding:4px 9px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1)}
.chip.hires{color:#2ef2c3;border-color:rgba(46,242,195,.7);box-shadow:0 0 12px rgba(46,242,195,.35)}
.chip.lossless{color:#8fc5ff;border-color:rgba(120,180,255,.7)}
.chip.dolby{color:#ff8fd0;border-color:rgba(255,61,165,.7)}
.npt{font-size:1.45rem;font-weight:700;text-align:center;line-height:1.25}
.npa{color:#cfc8e6;margin:2px 0 14px;text-align:center}
.npseek{width:100%}.npseek input{width:100%}
.nptm{display:flex;justify-content:space-between;font-size:.72rem;color:#b9b2d4}
.npctl{display:flex;align-items:center;justify-content:center;gap:30px;margin:10px 0 16px}
.npctl button{background:none;border:0;color:#fff;font-size:1.8rem;cursor:pointer}
.npctl .npp{width:70px;height:70px;border-radius:50%;font-size:2rem;display:flex;align-items:center;justify-content:center;padding:0;background:linear-gradient(145deg,rgba(100,180,255,.4),rgba(40,100,230,.12));border:1px solid rgba(150,205,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 22px rgba(70,150,255,.45)}
.npst{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:.82rem;color:#cfc8e6}
#nlk{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:9px 16px;cursor:pointer;font:inherit;font-size:.85rem}
#nlk.on{color:#ff3da5;border-color:#ff3da5;box-shadow:0 0 14px rgba(255,61,165,.35)}
.npi{margin-top:12px;font-size:.72rem;color:#9d96b8;text-align:center}

.nptop{justify-content:space-between}
.nptop .gl{background:linear-gradient(145deg,rgba(120,190,255,.42),rgba(50,100,230,.12) 60%,rgba(255,255,255,.08));border:1px solid rgba(160,210,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -8px 14px rgba(60,120,255,.2),0 6px 18px rgba(0,0,0,.35),0 0 18px rgba(80,150,255,.35);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);color:#eaf4ff}
.nptop .cir{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;font-size:1.3rem;cursor:pointer}
.nptop .cir.on{color:#ff6bbd;border-color:rgba(255,107,189,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 18px rgba(255,61,165,.5)}
.pill{height:42px;padding:0 24px;border-radius:21px;display:flex;align-items:center;gap:6px}
.pill b{display:block;width:4px;height:22px;border-radius:2px;background:linear-gradient(180deg,#2ef2c3,#7fb5ff);transform:scaleY(.25);animation:eq 1.1s ease-in-out infinite;animation-play-state:paused}
.pill b:nth-child(2){animation-delay:-.3s}.pill b:nth-child(3){animation-delay:-.6s}.pill b:nth-child(4){animation-delay:-.15s}.pill b:nth-child(5){animation-delay:-.8s}
#np.pl .pill b{animation-play-state:running}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}

.art b.bq{top:10px;left:10px;font-size:.78rem;font-weight:800;letter-spacing:.09em;padding:6px 13px;border-radius:12px}
.bq,.chip{position:relative;color:#eaf4ff;text-shadow:0 1px 2px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.6);background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.1) 55%,rgba(130,190,255,.22));box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -5px 9px rgba(80,150,255,.28),0 4px 12px rgba(0,0,0,.45)}
.art b.bq{position:absolute}
.bq::after,.chip::after{content:'';position:absolute;left:0;right:0;top:0;height:50%;border-radius:11px 11px 40% 40%/11px 11px 8px 8px;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
.chip{font-size:.72rem;padding:6px 12px;border-radius:11px;font-weight:800}
.bq.hires,.chip.hires{color:#c8fff4;border-color:rgba(46,242,195,.95);background:linear-gradient(145deg,rgba(46,242,195,.55),rgba(15,110,100,.4) 60%,rgba(255,255,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -5px 9px rgba(46,242,195,.3),0 4px 14px rgba(0,0,0,.45),0 0 14px rgba(46,242,195,.5)}
.bq.lossless,.chip.lossless{color:#dcedff;border-color:rgba(120,180,255,.95);background:linear-gradient(145deg,rgba(110,170,255,.58),rgba(35,75,200,.4) 60%,rgba(255,255,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -5px 9px rgba(70,130,255,.35),0 4px 14px rgba(0,0,0,.45),0 0 14px rgba(90,150,255,.5)}
.bq.dolby,.chip.dolby{color:#ffe0f2;border-color:rgba(255,100,190,.95);background:linear-gradient(145deg,rgba(255,80,175,.55),rgba(120,30,170,.42) 60%,rgba(255,255,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -5px 9px rgba(190,60,220,.35),0 4px 14px rgba(0,0,0,.45),0 0 14px rgba(255,61,165,.5)}

.cntrow{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:2px}
.mpill{font:inherit;font-size:.66rem;font-weight:800;letter-spacing:.12em;padding:5px 13px;border-radius:12px;color:#dcedff;cursor:pointer;border:1px solid rgba(150,205,255,.6);background:linear-gradient(145deg,rgba(110,170,255,.45),rgba(35,75,200,.2));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 12px rgba(80,150,255,.35)}
.npctl{gap:20px}

.mini svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.npi{cursor:pointer;text-decoration:underline dotted rgba(255,255,255,.35);text-underline-offset:4px}
.pill{cursor:pointer}
.vis{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none}
.vis i{position:absolute;border-radius:50%;width:80vmin;height:80vmin;will-change:transform,opacity;animation:vp 3.4s ease-in-out infinite;animation-play-state:paused}
.vis i:nth-child(1){left:-25vmin;top:12%;background:radial-gradient(circle,rgba(46,242,195,.42),transparent 65%)}
.vis i:nth-child(2){right:-28vmin;top:42%;background:radial-gradient(circle,rgba(255,61,165,.38),transparent 65%);animation-duration:4.1s;animation-delay:-1.2s}
.vis i:nth-child(3){left:10%;top:62%;width:90vmin;height:90vmin;background:radial-gradient(circle,rgba(123,44,255,.45),transparent 65%);animation-duration:5s;animation-delay:-2.3s}

#bk{position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;background:rgba(3,2,10,.45);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}

.bh{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#cfe3ff;margin-bottom:10px;text-align:center}

.qm{flex:1;min-width:0}
.qt{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function pickRate(t){
  if(E.sr!=='auto')return E.ok[E.sr]===false?0:E.sr;
  var base=(t&&t.info&&t.info.sr)||0;if(!base)return 0;
  var sup=RATES.filter(function(r){return E.ok[r]!==false});

  return up.length?up[0]:(sup.length?sup[sup.length-1]:0);

function loadQ(ctx){
  if(!ctx.audioWorklet||typeof AudioWorkletNode==='undefined'){E.q='none';return}
  var code=[
   "class Q extends AudioWorkletProcessor{",
   "constructor(){super();var s=this;s.b=24;s.d=1;s.port.onmessage=function(e){s.b=e.data.b;s.d=e.data.d}}",
   "process(i,o){var a=i[0],b=o[0];if(!a||!a.length){return true}",
   "for(var c=0;c<b.length;c++){var x=a[c]||a[0],y=b[c];",
   "if(this.b>=32){y.set(x);continue}",
   "var s=Math.pow(2,this.b-1),k=1/s,d=this.d;",
   "for(var n=0;n<x.length;n++){var v=x[n]*s;if(d){v+=Math.random()-Math.random()}v=Math.round(v);if(v>s-1){v=s-1}else if(v<-s){v=-s}y[n]=v*k}}",
   "return true}}registerProcessor('hrq',Q);"
  ].join('');
  var u=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
  ctx.audioWorklet.addModule(u).then(function(){
    URL.revokeObjectURL(u);
    if(E.ctx!==ctx)return;
    var wn=new AudioWorkletNode(ctx,'hrq',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[2]});
    wn.channelCount=2;wn.channelCountMode='explicit';
    try{E.pre.disconnect()}catch(e){}
    E.pre.connect(wn);wn.connect(ctx.destination);

function engSetup(t){
  var C=window.AudioContext||window.webkitAudioContext;
