name: Build APK

on:
  push:
    branches:
      - main
      - feature/max-hires
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ] && cp sw.js www/ || true
          [ -f icon-192.png ] && cp icon-192.png www/ || true
          [ -f icon-512.png ] && cp icon-512.png www/ || true
          [ -f icon-maskable-512.png ] && cp icon-maskable-512.png www/ || true

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Force Android SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          if not p.exists():
              raise SystemExit("android/variables.gradle not found")

          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'compileSdkVersion\s*=\s*\d+',
              'compileSdkVersion = 36',
              s
          )

          s = re.sub(
              r'targetSdkVersion\s*=\s*\d+',
              'targetSdkVersion = 36',
              s
          )

          p.write_text(s, encoding="utf-8")
          print("Android SDK set to 36")
          PY

      - name: Add Media3 ExoPlayer dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit("android/app/build.gradle not found")

          s = p.read_text(encoding="utf-8")

          dependencies = """
              implementation 'androidx.media3:media3-exoplayer:1.5.1'
              implementation 'androidx.media3:media3-common:1.5.1'
          """

          if "androidx.media3:media3-exoplayer" not in s:
              s, count = re.subn(
                  r'dependencies\s*\{',
                  'dependencies {\\n' + dependencies,
                  s,
                  count=1
              )

              if count == 0:
                  raise SystemExit("dependencies block not found")

          p.write_text(s, encoding="utf-8")
          print("Media3 dependencies added")
          PY

      - name: Write native plugins
        run: |
          D="android/app/src/main/java/kz/enakypbek/hires"
          mkdir -p "$D"

          cat > "$D/MainActivity.java" <<'EOF'
          package kz.enakypbek.hires;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioInfoPlugin.class);
                  registerPlugin(HiResAudioPlugin.class);
                  registerPlugin(NativeAudioPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          cat > "$D/AudioInfoPlugin.java" <<'EOF'
          package kz.enakypbek.hires;

          import android.content.Context;
          import android.media.AudioManager;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AudioInfo")
          public class AudioInfoPlugin extends Plugin {

              @PluginMethod
              public void get(PluginCall call) {
                  JSObject ret = new JSObject();

                  try {
                      AudioManager am =
                              (AudioManager) getContext()
                                      .getSystemService(Context.AUDIO_SERVICE);

                      String rate =
                              am.getProperty(
                                      AudioManager.PROPERTY_OUTPUT_SAMPLE_RATE
                              );

                      String frames =
                              am.getProperty(
                                      AudioManager.PROPERTY_OUTPUT_FRAMES_PER_BUFFER
                              );

                      int outRate = 0;
                      int outFrames = 0;

                      try {
                          outRate = Integer.parseInt(rate);
                      } catch (Throwable ignored) {}

                      try {
                          outFrames = Integer.parseInt(frames);
                      } catch (Throwable ignored) {}

                      ret.put("outRate", outRate);
                      ret.put("outFrames", outFrames);

                      call.resolve(ret);

                  } catch (Throwable e) {
                      call.reject("AudioInfo.get: " + e.getMessage());
                  }
              }
          }
          EOF

          cat > "$D/NativeAudioPlugin.java" <<'EOF'
          package kz.enakypbek.hires;

          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;

          import androidx.media3.common.AudioAttributes;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.DefaultRenderersFactory;
          import androidx.media3.exoplayer.ExoPlayer;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;

          @CapacitorPlugin(name = "NativeAudio")
          public class NativeAudioPlugin extends Plugin {

              private final Handler main =
                      new Handler(Looper.getMainLooper());

              private ExoPlayer player = null;
              private FileOutputStream writeOutput = null;
              private File partFile = null;
              private File finalFile = null;

              private File audioDirectory() {
                  File directory =
                          new File(
                                  getContext().getCacheDir(),
                                  "hires_native"
                          );

                  if (!directory.exists()) {
                      directory.mkdirs();
                  }

                  return directory;
              }

              private File fileFor(String key, String extension) {

                  if (extension == null || extension.trim().isEmpty()) {
                      extension = "flac";
                  }

                  String safeExtension =
                          extension.replaceAll(
                                  "[^A-Za-z0-9]",
                                  ""
                          );

                  if (safeExtension.isEmpty()) {
                      safeExtension = "flac";
                  }

                  return new File(
                          audioDirectory(),
                          "t"
                                  + Integer.toHexString(key.hashCode())
                                  + "."
                                  + safeExtension
                  );
              }

              @PluginMethod
              public void beginFile(PluginCall call) {

                  try {
                      String key = call.getString("key", "t");
                      String extension = call.getString("ext", "flac");

                      long size =
                              call.getData()
                                      .optLong("size", 0L);

                      File file = fileFor(key, extension);

                      JSObject result = new JSObject();

                      if (
                              file.exists() &&
                              size > 0 &&
                              file.length() == size
                      ) {
                          result.put("cached", true);
                          call.resolve(result);
                          return;
                      }

                      closeWriter();

                      finalFile = file;
                      partFile =
                              new File(
                                      file.getAbsolutePath() + ".part"
                              );

                      if (partFile.exists()) {
                          partFile.delete();
                      }

                      writeOutput =
                              new FileOutputStream(partFile);

                      result.put("cached", false);
                      call.resolve(result);

                  } catch (Throwable e) {
                      call.reject(
                              "beginFile: " + e.getMessage()
                      );
                  }
              }

              @PluginMethod
              public void appendChunk(PluginCall call) {

                  try {
                      if (writeOutput == null) {
                          call.reject(
                                  "appendChunk: no open file"
                          );
                          return;
                      }

                      String data =
                              call.getString("data", "");

                      byte[] decoded =
                              Base64.decode(
                                      data,
                                      Base64.DEFAULT
                              );

                      writeOutput.write(decoded);
                      call.resolve();

                  } catch (Throwable e) {
                      call.reject(
                              "appendChunk: " + e.getMessage()
                      );
                  }
              }

              @PluginMethod
              public void endFile(PluginCall call) {

                  try {
                      closeWriter();

                      if (
                              partFile != null &&
                              finalFile != null
                      ) {
                          if (finalFile.exists()) {
                              finalFile.delete();
                          }

                          boolean renamed =
                                  partFile.renameTo(finalFile);

                          if (!renamed) {
                              call.reject(
                                      "endFile: failed to finalize audio file"
                              );
                              return;
                          }
                      }

                      call.resolve();

                  } catch (Throwable e) {
                      call.reject(
                              "endFile: " + e.getMessage()
                      );
                  }
              }

              private void closeWriter() {

                  if (writeOutput != null) {
                      try {
                          writeOutput.flush();
                      } catch (Throwable ignored) {}

                      try {
                          writeOutput.close();
                      } catch (Throwable ignored) {}

                      writeOutput = null;
                  }
              }

              private void ensurePlayer() {

                  if (player != null) {
                      return;
                  }

                  DefaultRenderersFactory renderersFactory =
                          new DefaultRenderersFactory(
                                  getContext()
                          );

                  renderersFactory
                          .setEnableAudioFloatOutput(false);

                  AudioAttributes audioAttributes =
                          new AudioAttributes.Builder()
                                  .setUsage(C.USAGE_MEDIA)
                                  .setContentType(
                                          C.AUDIO_CONTENT_TYPE_MUSIC
                                  )
                                  .build();

                  player =
                          new ExoPlayer.Builder(
                                  getContext(),
                                  renderersFactory
                          )
                                  .setAudioAttributes(
                                          audioAttributes,
                                          true
                                  )
                                  .setWakeMode(
                                          C.WAKE_MODE_LOCAL
                                  )
                                  .build();
              }

              @PluginMethod
              public void load(final PluginCall call) {

                  final String key =
                          call.getString("key", "t");

                  final String extension =
                          call.getString("ext", "flac");

                  final long startMs =
                          call.getData()
                                  .optLong("startMs", 0L);

                  final boolean autoplay =
                          call.getBoolean(
                                  "autoplay",
                                  true
                          );

                  final File file =
                          fileFor(key, extension);

                  if (!file.exists()) {
                      call.reject(
                              "Audio file not found"
                      );
                      return;
                  }

                  main.post(() -> {

                      try {
                          ensurePlayer();

                          player.setMediaItem(
                                  MediaItem.fromUri(
                                          Uri.fromFile(file)
                                  ),
                                  startMs
                          );

                          player.prepare();
                          player.setPlayWhenReady(autoplay);

                          JSObject result =
                                  new JSObject();

                          result.put("ok", true);
                          result.put(
                                  "mode",
                                  "Native Media3"
                          );

                          call.resolve(result);

                      } catch (Throwable e) {
                          call.reject(
                                  "load: " + e.getMessage()
                          );
                      }
                  });
              }

              @PluginMethod
              public void play(final PluginCall call) {

                  main.post(() -> {
                      if (player != null) {
                          player.play();
                      }

                      call.resolve();
                  });
              }

              @PluginMethod
              public void pause(final PluginCall call) {

                  main.post(() -> {
                      if (player != null) {
                          player.pause();
                      }

                      call.resolve();
                  });
              }

              @PluginMethod
              public void seek(final PluginCall call) {

                  final long ms =
                          call.getData()
                                  .optLong("ms", 0L);

                  main.post(() -> {
                      if (player != null) {
                          player.seekTo(ms);
                      }

                      call.resolve();
                  });
              }

              @PluginMethod
              public void stop(final PluginCall call) {

                  main.post(() -> {
                      if (player != null) {
                          player.stop();
                          player.clearMediaItems();
                      }

                      call.resolve();
                  });
              }

              @PluginMethod
              public void getState(final PluginCall call) {

                  main.post(() -> {

                      JSObject state =
                              new JSObject();

                      if (player == null) {
                          state.put("pos", 0);
                          state.put("dur", 0);
                          state.put("playing", false);

                      } else {
                          long duration =
                                  player.getDuration();

                          if (duration < 0) {
                              duration = 0;
                          }

                          state.put(
                                  "pos",
                                  player.getCurrentPosition()
                          );

                          state.put(
                                  "dur",
                                  duration
                          );

                          state.put(
                                  "playing",
                                  player.isPlaying()
                          );
                      }

                      call.resolve(state);
                  });
              }

              @PluginMethod
              public void setOptions(PluginCall call) {
                  call.resolve();
              }

              @PluginMethod
              public void scan(PluginCall call) {
                  call.resolve(new JSObject());
              }

              @PluginMethod
              public void bind(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put("ok", true);
                  call.resolve(result);
              }

              @PluginMethod
              public void setMedia(PluginCall call) {
                  call.resolve();
              }

              @PluginMethod
              public void probe(PluginCall call) {
                  call.resolve(new JSObject());
              }

              @PluginMethod
              public void launchInfo(PluginCall call) {
                  call.resolve(new JSObject());
              }

              @Override
              protected void handleOnDestroy() {

                  closeWriter();

                  if (player != null) {
                      player.release();
                      player = null;
                  }

                  super.handleOnDestroy();
              }
          }
          EOF

          cat > "$D/HiResAudioPlugin.java" <<'EOF'
          package kz.enakypbek.hires;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "HiResAudio")
          public class HiResAudioPlugin extends Plugin {

              @PluginMethod
              public void startForegroundService(
                      PluginCall call
              ) {
                  call.resolve();
              }

              @PluginMethod
              public void stopForegroundService(
                      PluginCall call
              ) {
                  call.resolve();
              }

              @PluginMethod
              public void requestBatteryExemption(
                      PluginCall call
              ) {
                  call.resolve();
              }
          }
          EOF

      - name: Patch AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text(encoding="utf-8")

          permissions = [
              "android.permission.WAKE_LOCK",
              "android.permission.MODIFY_AUDIO_SETTINGS"
          ]

          additions = ""

          for permission in permissions:
              if permission not in s:
                  additions += (
                      '    <uses-permission android:name="'
                      + permission
                      + '" />\n'
                  )

          if additions:
              s = s.replace(
                  "</manifest>",
                  additions + "</manifest>"
              )

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("AndroidManifest patched")
          PY

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Show environment
        run: |
          node --version
          npm --version
          java -version
          npx cap --version

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArmaMusic-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
