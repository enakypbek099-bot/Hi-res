name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Create Android project
        run: npx cap add android

      - name: Add Media3 ExoPlayer dependency
        run: |
          python3 - << 'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          dep = "    implementation 'androidx.media3:media3-exoplayer:1.5.1'\n    implementation 'androidx.media3:media3-common:1.5.1'\n"
          if 'media3-exoplayer' not in s:
              s, n = re.subn(r'^dependencies \{\n', 'dependencies {\n' + dep, s, count=1, flags=re.M)
              if n == 0:
                  raise SystemExit('dependencies block not found in app/build.gradle')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "media3" android/app/build.gradle

      - name: Write native plugins
        run: |
          D=android/app/src/main/java/kz/enakypbek/hires
          R=android/app/src/main/res
          mkdir -p $D $R/layout $R/drawable $R/xml
          cat > $R/xml/device_filter.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="1" />
          </resources>
          EOF
          cat > $D/MainActivity.java << 'EOF'
          package kz.enakypbek.hires;

          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioInfoPlugin.class);
                  registerPlugin(HiResAudioPlugin.class);
                  registerPlugin(NativeAudioPlugin.class);
                  super.onCreate(savedInstanceState);
                  NativeAudioPlugin.onUsbIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  NativeAudioPlugin.onUsbIntent(intent);
              }

              private void keepAlive() {
                  try {
                      WebView w = getBridge().getWebView();
                      if (w != null) {
                          w.onResume();
                          w.resumeTimers();
                      }
                  } catch (Exception e) { }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  keepAlive();
              }

              @Override
              public void onStop() {
                  super.onStop();
                  keepAlive();
              }
          }
          EOF
          cat > $D/AudioInfoPlugin.java << 'EOF'
          package kz.enakypbek.hires;

          import android.content.Context;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import android.os.Build;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AudioInfo")
          public class AudioInfoPlugin extends Plugin {

              private static String kindOf(int t) {
                  switch (t) {
                      case 7: case 8: case 26: case 27: return "bt";
                      case 3: case 4: case 5: case 6: case 11: case 22: return "wired";
                      case 1: case 2: return "spk";
                      default: return "other";
                  }
              }

              private static int rank(int t) {
                  switch (t) {
                      case 11: case 22: return 5;
                      case 3: case 4: case 5: case 6: return 4;
                      case 8: case 26: case 27: return 3;
                      case 7: return 2;
                      case 9: return 2;
                      case 2: return 1;
                      default: return 0;
                  }
              }

              @PluginMethod
              public void get(PluginCall call) {
                  JSObject ret = new JSObject();
                  try {
                      AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                      if (am != null) {
                          String sr = am.getProperty(AudioManager.PROPERTY_OUTPUT_SAMPLE_RATE);
                          String fr = am.getProperty(AudioManager.PROPERTY_OUTPUT_FRAMES_PER_BUFFER);
                          ret.put("outRate", sr != null ? Integer.parseInt(sr) : 48000);
                          ret.put("outFrames", fr != null ? Integer.parseInt(fr) : 192);
                          ret.put("vol", am.getStreamVolume(AudioManager.STREAM_MUSIC));
                          ret.put("volMax", am.getStreamMaxVolume(AudioManager.STREAM_MUSIC));

                          AudioDeviceInfo best = null;
                          AudioDeviceInfo[] outs = am.getDevices(AudioManager.GET_DEVICES_OUTPUTS);
                          for (AudioDeviceInfo d : outs) {
                              if (best == null || rank(d.getType()) > rank(best.getType())) best = d;
                          }
                          if (best != null) {
                              JSObject dev = new JSObject();
                              CharSequence nm = best.getProductName();
                              dev.put("name", nm != null ? nm.toString() : "");
                              dev.put("type", best.getType());
                              dev.put("kind", kindOf(best.getType()));
                              JSArray rates = new JSArray();
                              for (int x : best.getSampleRates()) rates.put(x);
                              JSArray enc = new JSArray();
                              for (int x : best.getEncodings()) enc.put(x);
                              JSArray ch = new JSArray();
                              for (int x : best.getChannelCounts()) ch.put(x);
                              dev.put("rates", rates);
                              dev.put("enc", enc);
                              dev.put("ch", ch);
                              ret.put("dev", dev);
                          }
                      }
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("AudioInfo: " + e.getMessage());
                  }
              }
          }
          EOF
          cat > $D/NativeAudioPlugin.java << 'EOF'
          package kz.enakypbek.hires;

          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.Bitmap;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.media.AudioDeviceCallback;
          import android.media.MediaMetadata;
          import android.media.VolumeProvider;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.media.AudioAttributes;
          import android.media.AudioDeviceInfo;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioMixerAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;

          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.PlaybackException;
          import androidx.media3.common.Player;
          import androidx.media3.exoplayer.DefaultRenderersFactory;
          import androidx.media3.exoplayer.ExoPlayer;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;

          @CapacitorPlugin(name = "NativeAudio")
          public class NativeAudioPlugin extends Plugin {
              private final Handler main = new Handler(Looper.getMainLooper());
              private ExoPlayer player = null;
              private boolean playerFloat = false;
              private FileOutputStream wOut = null;
              private static NativeAudioPlugin inst = null;
              static volatile boolean usbLaunch = false;
              static final String ACT_PERM = "kz.enakypbek.hires.USB_PERM";
              private boolean optAuto = false, optNoSpk = false, optMedia = false;
              private String boundName = "";
              private int volCur = 50;
              private MediaSession msess = null;
              private VolumeProvider vprov = null;
              private AudioDeviceCallback devCb = null;
              private BroadcastReceiver permRx = null;
              private File wPart = null;
              private File wFinal = null;

              @Override
              public void load() {
                  inst = this;
                  try {
                      android.content.SharedPreferences sp = getContext().getSharedPreferences("hires_dac", 0);
                      boundName = sp.getString("bound", "");
                      optAuto = sp.getBoolean("auto", false);
                      optNoSpk = sp.getBoolean("nospk", false);
                      optMedia = sp.getBoolean("media", false);
                      volCur = sp.getInt("vol", 50);
                  } catch (Throwable t) { }
                  registerDevCb();
              }

              static void onUsbIntent(Intent i) {
                  try {
                      if (i != null && UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(i.getAction())) {
                          usbLaunch = true;
                          if (inst != null) inst.emit("usb", "", 0);
                      }
                  } catch (Throwable t) { }
              }

              private static boolean isUsb(int t) {
                  return t == AudioDeviceInfo.TYPE_USB_DEVICE || t == AudioDeviceInfo.TYPE_USB_HEADSET || t == AudioDeviceInfo.TYPE_USB_ACCESSORY;
              }

              private static String nameOf(AudioDeviceInfo d) {
                  CharSequence n = d.getProductName();
                  return n == null ? "USB" : n.toString();
              }

              private AudioManager audioMgr() {
                  return (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
              }

              private static AudioDeviceInfo findDac(AudioManager am, String prefer) {
                  AudioDeviceInfo first = null;
                  for (AudioDeviceInfo d : am.getDevices(AudioManager.GET_DEVICES_OUTPUTS)) {
                      if (!d.isSink() || !isUsb(d.getType())) continue;
                      if (prefer != null && prefer.length() > 0 && prefer.equals(nameOf(d))) return d;
                      if (first == null) first = d;
                  }
                  return first;
              }

              private void saveOpts() {
                  try {
                      getContext().getSharedPreferences("hires_dac", 0).edit()
                              .putString("bound", boundName).putBoolean("auto", optAuto)
                              .putBoolean("nospk", optNoSpk).putBoolean("media", optMedia).apply();
                  } catch (Throwable t) { }
              }

              private void registerDevCb() {
                  try {
                      AudioManager am = audioMgr();
                      if (am == null) return;
                      devCb = new AudioDeviceCallback() {
                          @Override
                          public void onAudioDevicesAdded(AudioDeviceInfo[] added) {
                              for (AudioDeviceInfo d : added) {
                                  if (d.isSink() && isUsb(d.getType())) emit("dac+", nameOf(d), d.getType());
                              }
                          }

                          @Override
                          public void onAudioDevicesRemoved(AudioDeviceInfo[] removed) {
                              for (AudioDeviceInfo d : removed) {
                                  if (d.isSink() && isUsb(d.getType())) {
                                      if (optNoSpk) pauseNow();
                                      emit("dac-", nameOf(d), d.getType());
                                  }
                              }
                          }
                      };
                      am.registerAudioDeviceCallback(devCb, main);
                  } catch (Throwable t) { }
              }

              private void pauseNow() {
                  onMain(new Runnable() {
                      public void run() {
                          try { if (player != null) player.pause(); } catch (Throwable t) { }
                      }
                  });
              }

              private void setPreferredDevice(AudioDeviceInfo d) {
                  try {
                      if (player == null) return;
                      java.lang.reflect.Method m = ExoPlayer.class.getMethod("setPreferredAudioDevice", AudioDeviceInfo.class);
                      m.invoke(player, d);
                  } catch (Throwable t) { }
              }

              private void onMain(Runnable r) {
                  if (Looper.myLooper() == Looper.getMainLooper()) r.run();
                  else main.post(r);
              }

              private void emit(String type, String msg, long val) {
                  try {
                      JSObject o = new JSObject();
                      o.put("t", type);
                      o.put("msg", msg == null ? "" : msg);
                      o.put("val", val);
                      notifyListeners("native", o);
                  } catch (Throwable t) { }
              }

              private File dir() {
                  File d = new File(getContext().getCacheDir(), "hires_native");
                  if (!d.exists()) d.mkdirs();
                  return d;
              }

              private File fileFor(String key, String ext) {
                  String e = ext == null ? "flac" : ext.toLowerCase().replaceAll("[^a-z0-9]", "");
                  if (e.length() == 0) e = "bin";
                  return new File(dir(), "t" + Integer.toHexString(key.hashCode()) + "." + e);
              }

              private void prune(File keep) {
                  try {
                      File[] fs = dir().listFiles();
                      if (fs == null) return;
                      List<File> l = new ArrayList<File>(Arrays.asList(fs));
                      Collections.sort(l, new Comparator<File>() {
                          public int compare(File a, File b) {
                              return Long.compare(b.lastModified(), a.lastModified());
                          }
                      });
                      int n = 0;
                      for (File f : l) {
                          if (keep != null && f.equals(keep)) { n++; continue; }
                          n++;
                          if (n > 3) f.delete();
                      }
                  } catch (Throwable t) { }
              }

              @PluginMethod
              public void beginFile(PluginCall call) {
                  try {
                      String key = call.getString("key", "t");
                      String ext = call.getString("ext", "flac");
                      long size = call.getData().optLong("size", 0L);
                      File f = fileFor(key, ext);
                      JSObject r = new JSObject();
                      if (f.exists() && f.length() == size && size > 0) {
                          f.setLastModified(System.currentTimeMillis());
                          r.put("cached", true);
                          call.resolve(r);
                          return;
                      }
                      if (wOut != null) { try { wOut.close(); } catch (Throwable t) { } wOut = null; }
                      wFinal = f;
                      wPart = new File(f.getAbsolutePath() + ".part");
                      if (wPart.exists()) wPart.delete();
                      wOut = new FileOutputStream(wPart);
                      r.put("cached", false);
                      call.resolve(r);
                  } catch (Throwable e) {
                      call.reject("NativeAudio beginFile: " + e);
                  }
              }

              @PluginMethod
              public void appendChunk(PluginCall call) {
                  try {
                      String data = call.getString("data", "");
                      byte[] b = Base64.decode(data, Base64.DEFAULT);
                      if (wOut == null) { call.reject("нет открытого файла"); return; }
                      wOut.write(b);
                      call.resolve();
                  } catch (Throwable e) {
                      call.reject("NativeAudio appendChunk: " + e);
                  }
              }

              @PluginMethod
              public void endFile(PluginCall call) {
                  try {
                      if (wOut != null) { wOut.flush(); wOut.close(); wOut = null; }
                      if (wPart != null && wFinal != null) {
                          if (wFinal.exists()) wFinal.delete();
                          if (!wPart.renameTo(wFinal)) { call.reject("не удалось сохранить файл"); return; }
                          prune(wFinal);
                      }
                      call.resolve();
                  } catch (Throwable e) {
                      call.reject("NativeAudio endFile: " + e);
                  }
              }

              private void ensurePlayer(boolean floatOut) {
                  if (player != null && playerFloat == floatOut) return;
                  if (player != null) {
                      try { player.release(); } catch (Throwable t) { }
                      player = null;
                  }
                  DefaultRenderersFactory rf = new DefaultRenderersFactory(getContext());
                  rf.setEnableAudioFloatOutput(floatOut);
                  androidx.media3.common.AudioAttributes aa = new androidx.media3.common.AudioAttributes.Builder()
                          .setUsage(C.USAGE_MEDIA)
                          .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                          .build();
                  player = new ExoPlayer.Builder(getContext(), rf)
                          .setAudioAttributes(aa, true)
                          .setHandleAudioBecomingNoisy(true)
                          .setWakeMode(C.WAKE_MODE_LOCAL)
                          .build();
                  player.addListener(new Player.Listener() {
                      @Override
                      public void onPlaybackStateChanged(int state) {
                          if (state == Player.STATE_ENDED) emit("ended", "", 0);
                          else if (state == Player.STATE_READY) {
                              long d = player != null ? player.getDuration() : 0;
                              emit("ready", "", d == C.TIME_UNSET ? 0 : d);
                          }
                      }

                      @Override
                      public void onIsPlayingChanged(boolean isPlaying) {
                          emit("playing", isPlaying ? "1" : "0", 0);
                      }

                      @Override
                      public void onPlayerError(PlaybackException error) {
                          emit("error", error.getErrorCodeName() + ": " + error.getMessage(), error.errorCode);
                      }
                  });
                  playerFloat = floatOut;
                  if (msess != null) {
                      try { player.setVolume((float) Math.pow(volCur / 100.0, 2.0)); } catch (Throwable t) { }
                  }
              }

              @PluginMethod
              public void load(final PluginCall call) {
                  final String key = call.getString("key", "t");
                  final String ext = call.getString("ext", "flac");
                  final long startMs = call.getData().optLong("startMs", 0L);
                  final boolean autoplay = call.getBoolean("autoplay", true);
                  final int bits = call.getInt("bits", 16);
                  final int sr = call.getInt("sr", 44100);
                  final boolean bp = call.getBoolean("bp", false);
                  final File f = fileFor(key, ext);
                  if (!f.exists()) { call.reject("файл не найден в кэше"); return; }
                  f.setLastModified(System.currentTimeMillis());
                  onMain(new Runnable() {
                      public void run() {
                          try {
                              boolean floatOut = bits > 16;
                              ensurePlayer(floatOut);
                              String bpMsg = "";
                              boolean bpOk = false;
                              int bpMode = 0;
                              AudioManager am0 = audioMgr();
                              AudioDeviceInfo dac = am0 == null ? null : findDac(am0, boundName);
                              if (optNoSpk && dac == null) {
                                  call.reject("USB ЦАП не подключён. Динамик отключён, поэтому воспроизведение не запущено.");
                                  return;
                              }
                              setPreferredDevice((optNoSpk || optAuto || boundName.length() > 0) ? dac : null);
                              if (bp) {
                                  if (Build.VERSION.SDK_INT >= 34) {
                                      String[] r = Bp.apply(getContext(), sr, floatOut, boundName);
                                      bpOk = "1".equals(r[0]);
                                      bpMode = "1".equals(r[0]) ? 1 : ("2".equals(r[0]) ? 2 : 0);
                                      bpMsg = r[1];
                                  } else {
                                      bpMsg = "Bit-perfect требует Android 14+";
                                  }
                              } else if (Build.VERSION.SDK_INT >= 34) {
                                  Bp.clear(getContext());
                              }
                              player.setMediaItem(MediaItem.fromUri(Uri.fromFile(f)), startMs);
                              player.prepare();
                              player.setPlayWhenReady(autoplay);
                              JSObject r = new JSObject();
                              r.put("bpOk", bpOk);
                              r.put("bpMode", bpMode);
                              r.put("dac", dac == null ? "" : nameOf(dac));
                              r.put("bpMsg", bpMsg);
                              r.put("float", floatOut);
                              call.resolve(r);
                          } catch (Throwable e) {
                              call.reject("NativeAudio load: " + e);
                          }
                      }
                  });
              }

              @PluginMethod
              public void play(final PluginCall call) {
                  onMain(new Runnable() {
                      public void run() {
                          try {
                              if (player != null) {
                                  if (player.getPlaybackState() == Player.STATE_ENDED) player.seekTo(0);
                                  player.play();
                              }
                              call.resolve();
                          } catch (Throwable e) { call.reject("NativeAudio play: " + e); }
                      }
                  });
              }

              @PluginMethod
              public void pause(final PluginCall call) {
                  onMain(new Runnable() {
                      public void run() {
                          try {
                              if (player != null) player.pause();
                              call.resolve();
                          } catch (Throwable e) { call.reject("NativeAudio pause: " + e); }
                      }
                  });
              }

              @PluginMethod
              public void seek(final PluginCall call) {
                  final long ms = call.getData().optLong("ms", 0L);
                  onMain(new Runnable() {
                      public void run() {
                          try {
                              if (player != null) player.seekTo(ms);
                              call.resolve();
                          } catch (Throwable e) { call.reject("NativeAudio seek: " + e); }
                      }
                  });
              }

              @PluginMethod
              public void stop(final PluginCall call) {
                  onMain(new Runnable() {
                      public void run() {
                          try {
                              if (player != null) { player.stop(); player.clearMediaItems(); }
                              if (Build.VERSION.SDK_INT >= 34) Bp.clear(getContext());
                              call.resolve();
                          } catch (Throwable e) { call.reject("NativeAudio stop: " + e); }
                      }
                  });
              }

              @PluginMethod
              public void getState(final PluginCall call) {
                  onMain(new Runnable() {
                      public void run() {
                          try {
                              JSObject o = new JSObject();
                              if (player != null) {
                                  long d = player.getDuration();
                                  o.put("pos", player.getCurrentPosition());
                                  o.put("dur", d == C.TIME_UNSET ? 0 : d);
                                  o.put("playing", player.isPlaying());
                                  o.put("pw", player.getPlayWhenReady());
                                  o.put("st", player.getPlaybackState());
                              } else {
                                  o.put("pos", 0);
                                  o.put("dur", 0);
                                  o.put("playing", false);
                                  o.put("pw", false);
                                  o.put("st", 1);
                              }
                              call.resolve(o);
                          } catch (Throwable e) { call.reject("NativeAudio getState: " + e); }
                      }
                  });
              }

              @PluginMethod
              public void launchInfo(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("usb", usbLaunch);
                  usbLaunch = false;
                  call.resolve(r);
              }

              @PluginMethod
              public void setOptions(final PluginCall call) {
                  optAuto = call.getBoolean("auto", false);
                  optNoSpk = call.getBoolean("nospk", false);
                  optMedia = call.getBoolean("media", false);
                  String b = call.getString("bound", "");
                  boundName = b == null ? "" : b;
                  saveOpts();
                  if (!optMedia) releaseSession();
                  call.resolve();
              }

              private static String ints(int[] a) {
                  if (a == null || a.length == 0) return "";
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < a.length; i++) {
                      if (i > 0) sb.append(",");
                      sb.append(a[i]);
                  }
                  return sb.toString();
              }

              @PluginMethod
              public void scan(PluginCall call) {
                  JSObject r = new JSObject();
                  JSArray outs = new JSArray();
                  JSArray usbs = new JSArray();
                  try {
                      Context c = getContext();
                      AudioManager am = audioMgr();
                      if (am != null) {
                          for (AudioDeviceInfo d : am.getDevices(AudioManager.GET_DEVICES_OUTPUTS)) {
                              JSObject o = new JSObject();
                              o.put("name", nameOf(d));
                              o.put("type", d.getType());
                              o.put("usb", isUsb(d.getType()));
                              o.put("id", d.getId());
                              if (Build.VERSION.SDK_INT >= 28) o.put("addr", d.getAddress());
                              o.put("rates", ints(d.getSampleRates()));
                              o.put("ch", ints(d.getChannelCounts()));
                              String bp = "", mix = "";
                              if (Build.VERSION.SDK_INT >= 34) {
                                  String[] x = Bp.list(am, d);
                                  bp = x[0];
                                  mix = x[1];
                              }
                              o.put("bp", bp);
                              o.put("mix", mix);
                              outs.put(o);
                          }
                      }
                      UsbManager um = (UsbManager) c.getSystemService(Context.USB_SERVICE);
                      if (um != null) {
                          for (UsbDevice u : um.getDeviceList().values()) {
                              JSObject o = new JSObject();
                              int aud = 0, str = 0;
                              for (int i = 0; i < u.getInterfaceCount(); i++) {
                                  UsbInterface f = u.getInterface(i);
                                  if (f.getInterfaceClass() == UsbConstants.USB_CLASS_AUDIO) {
                                      aud++;
                                      if (f.getInterfaceSubclass() == 2) str++;
                                  }
                              }
                              o.put("name", u.getProductName() == null ? "USB" : u.getProductName());
                              o.put("maker", u.getManufacturerName() == null ? "" : u.getManufacturerName());
                              o.put("vid", u.getVendorId());
                              o.put("pid", u.getProductId());
                              o.put("audio", aud);
                              o.put("stream", str);
                              o.put("perm", um.hasPermission(u));
                              usbs.put(o);
                          }
                      }
                  } catch (Throwable e) {
                      r.put("err", e.toString());
                  }
                  r.put("outs", outs);
                  r.put("usb", usbs);
                  r.put("sdk", Build.VERSION.SDK_INT);
                  r.put("bound", boundName);
                  r.put("model", Build.MANUFACTURER + " " + Build.MODEL);
                  call.resolve(r);
              }

              private void requestUsbPerm(UsbManager um, UsbDevice dev) {
                  Context c = getContext();
                  if (permRx == null) {
                      permRx = new BroadcastReceiver() {
                          @Override
                          public void onReceive(Context ctx, Intent it) {
                              boolean g = it.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false);
                              emit("usbperm", g ? "1" : "0", 0);
                          }
                      };
                      IntentFilter f = new IntentFilter(ACT_PERM);
                      if (Build.VERSION.SDK_INT >= 33) c.registerReceiver(permRx, f, Context.RECEIVER_NOT_EXPORTED);
                      else c.registerReceiver(permRx, f);
                  }
                  Intent in = new Intent(ACT_PERM);
                  in.setPackage(c.getPackageName());
                  int fl = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0);
                  um.requestPermission(dev, PendingIntent.getBroadcast(c, 0, in, fl));
              }

              @PluginMethod
              public void bind(PluginCall call) {
                  try {
                      String want = call.getString("name", "");
                      if (call.getBoolean("clear", false)) {
                          boundName = "";
                          saveOpts();
                          JSObject r0 = new JSObject();
                          r0.put("ok", true);
                          r0.put("name", "");
                          call.resolve(r0);
                          return;
                      }
                      AudioManager am = audioMgr();
                      AudioDeviceInfo d = am == null ? null : findDac(am, want);
                      JSObject r = new JSObject();
                      if (d == null) {
                          r.put("ok", false);
                          r.put("msg", "USB ЦАП не найден. Подключите ЦАП и повторите.");
                          call.resolve(r);
                          return;
                      }
                      boundName = nameOf(d);
                      saveOpts();
                      UsbManager um = (UsbManager) getContext().getSystemService(Context.USB_SERVICE);
                      UsbDevice target = null;
                      if (um != null) {
                          for (UsbDevice u : um.getDeviceList().values()) {
                              boolean aud = false;
                              for (int i = 0; i < u.getInterfaceCount(); i++) {
                                  if (u.getInterface(i).getInterfaceClass() == UsbConstants.USB_CLASS_AUDIO) aud = true;
                              }
                              if (!aud) continue;
                              String pn = u.getProductName();
                              if (target == null || (pn != null && pn.equals(boundName))) target = u;
                          }
                      }
                      boolean has = false, asked = false;
                      if (um != null && target != null) {
                          has = um.hasPermission(target);
                          if (!has) {
                              requestUsbPerm(um, target);
                              asked = true;
                          }
                      }
                      r.put("ok", true);
                      r.put("name", boundName);
                      r.put("usbFound", target != null);
                      r.put("perm", has);
                      r.put("asked", asked);
                      call.resolve(r);
                  } catch (Throwable e) {
                      call.reject("NativeAudio bind: " + e);
                  }
              }

              private void applyVol(int v) {
                  volCur = Math.max(0, Math.min(100, v));
                  try {
                      if (vprov != null) vprov.setCurrentVolume(volCur);
                      if (player != null) player.setVolume((float) Math.pow(volCur / 100.0, 2.0));
                      getContext().getSharedPreferences("hires_dac", 0).edit().putInt("vol", volCur).apply();
                  } catch (Throwable t) { }
              }

              private void releaseSession() {
                  onMain(new Runnable() {
                      public void run() {
                          try {
                              if (msess != null) {
                                  msess.setActive(false);
                                  msess.release();
                                  msess = null;
                                  vprov = null;
                              }
                              if (player != null) player.setVolume(1f);
                          } catch (Throwable t) { }
                      }
                  });
              }

              private void ensureSession() {
                  if (msess != null) return;
                  msess = new MediaSession(getContext(), "HiResDac");
                  msess.setCallback(new MediaSession.Callback() {
                      @Override
                      public void onPlay() { HiResAudioPlugin.emit("resume"); }

                      @Override
                      public void onPause() { HiResAudioPlugin.emit("pause"); }

                      @Override
                      public void onStop() { HiResAudioPlugin.emit("pause"); }

                      @Override
                      public void onSkipToNext() { HiResAudioPlugin.emit("next"); }

                      @Override
                      public void onSkipToPrevious() { HiResAudioPlugin.emit("prev"); }

                      @Override
                      public void onSeekTo(long pos) {
                          try { if (player != null) player.seekTo(pos); } catch (Throwable t) { }
                      }
                  });
                  vprov = new VolumeProvider(VolumeProvider.VOLUME_CONTROL_ABSOLUTE, 100, volCur) {
                      @Override
                      public void onSetVolumeTo(int volume) { applyVol(volume); }

                      @Override
                      public void onAdjustVolume(int direction) { applyVol(volCur + direction * 5); }
                  };
                  msess.setPlaybackToRemote(vprov);
                  msess.setActive(true);
                  applyVol(volCur);
              }

              @PluginMethod
              public void setMedia(final PluginCall call) {
                  final String title = call.getString("title", "HI-RES");
                  final String artist = call.getString("artist", "");
                  final String art = call.getString("art", "");
                  final boolean playing = call.getBoolean("playing", false);
                  final long pos = call.getData().optLong("posMs", 0L);
                  final long dur = call.getData().optLong("durMs", 0L);
                  final boolean clear = call.getBoolean("clear", false);
                  onMain(new Runnable() {
                      public void run() {
                          try {
                              if (clear || !optMedia) {
                                  releaseSession();
                                  call.resolve();
                                  return;
                              }
                              ensureSession();
                              MediaMetadata.Builder mb = new MediaMetadata.Builder()
                                      .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                                      .putString(MediaMetadata.METADATA_KEY_ARTIST, artist)
                                      .putLong(MediaMetadata.METADATA_KEY_DURATION, dur);
                              if (art != null && art.length() > 20) {
                                  Bitmap b = HiResAudioPlugin.roundArt(art);
                                  if (b != null) mb.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, b);
                              }
                              msess.setMetadata(mb.build());
                              long acts = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE
                                      | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS
                                      | PlaybackState.ACTION_SEEK_TO | PlaybackState.ACTION_STOP;
                              PlaybackState ps = new PlaybackState.Builder()
                                      .setActions(acts)
                                      .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, pos, playing ? 1f : 0f)
                                      .build();
                              msess.setPlaybackState(ps);
                              call.resolve();
                          } catch (Throwable e) {
                              call.reject("NativeAudio setMedia: " + e);
                          }
                      }
                  });
              }

              @PluginMethod
              public void probe(PluginCall call) {
                  JSObject r = new JSObject();
                  JSArray lines = new JSArray();
                  try {
                      lines.put("Android " + Build.VERSION.RELEASE + " (API " + Build.VERSION.SDK_INT + ")");
                      if (Build.VERSION.SDK_INT >= 34) {
                          String[] x = Bp.describe(getContext());
                          for (String s : x) lines.put(s);
                      } else {
                          lines.put("Bit-perfect: нужен Android 14+");
                      }
                  } catch (Throwable e) {
                      lines.put("probe ошибка: " + e);
                  }
                  r.put("lines", lines);
                  call.resolve(r);
              }

              @Override
              protected void handleOnDestroy() {
                  try {
                      if (player != null) { player.release(); player = null; }
                  } catch (Throwable t) { }
                  try {
                      if (msess != null) { msess.setActive(false); msess.release(); msess = null; }
                      AudioManager am = audioMgr();
                      if (am != null && devCb != null) am.unregisterAudioDeviceCallback(devCb);
                      if (permRx != null) getContext().unregisterReceiver(permRx);
                  } catch (Throwable t) { }
                  super.handleOnDestroy();
              }

              /* ---- Android 14+: bit-perfect микшер (минуя системный микшер/ресемплинг) ---- */
              static class Bp {
                  static AudioDeviceInfo lastDev = null;

                  static AudioAttributes attrs() {
                      return new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build();
                  }

                  static int rank(int t) {
                      switch (t) {
                          case 11: case 22: case 12: return 5;
                          case 3: case 4: case 5: case 6: return 4;
                          case 8: case 26: case 27: return 2;
                          case 2: return 1;
                          default: return 0;
                      }
                  }

                  static String encName(int e) {
                      switch (e) {
                          case AudioFormat.ENCODING_PCM_16BIT: return "16";
                          case AudioFormat.ENCODING_PCM_FLOAT: return "float";
                          case AudioFormat.ENCODING_PCM_24BIT_PACKED: return "24";
                          case AudioFormat.ENCODING_PCM_32BIT: return "32";
                          case AudioFormat.ENCODING_PCM_8BIT: return "8";
                          default: return "enc" + e;
                      }
                  }

                  static int encRank(int e) {
                      switch (e) {
                          case AudioFormat.ENCODING_PCM_FLOAT: return 5;
                          case AudioFormat.ENCODING_PCM_32BIT: return 4;
                          case AudioFormat.ENCODING_PCM_24BIT_PACKED: return 3;
                          case AudioFormat.ENCODING_PCM_16BIT: return 2;
                          default: return 1;
                      }
                  }

                  static List<AudioDeviceInfo> sorted(AudioManager am, final String prefer) {
                      List<AudioDeviceInfo> l = new ArrayList<AudioDeviceInfo>(Arrays.asList(am.getDevices(AudioManager.GET_DEVICES_OUTPUTS)));
                      Collections.sort(l, new Comparator<AudioDeviceInfo>() {
                          public int compare(AudioDeviceInfo a, AudioDeviceInfo b) {
                              int pa = (prefer != null && prefer.length() > 0 && prefer.equals(nameOf(a))) ? 100 : 0;
                              int pb = (prefer != null && prefer.length() > 0 && prefer.equals(nameOf(b))) ? 100 : 0;
                              return (rank(b.getType()) + pb) - (rank(a.getType()) + pa);
                          }
                      });
                      return l;
                  }

                  static String[] apply(Context c, int sr, boolean wantFloat, String prefer) {
                      try {
                          AudioManager am = (AudioManager) c.getSystemService(Context.AUDIO_SERVICE);
                          if (am == null) return new String[]{"0", "AudioManager недоступен"};
                          clear(c);
                          int wantEnc = wantFloat ? AudioFormat.ENCODING_PCM_FLOAT : AudioFormat.ENCODING_PCM_16BIT;
                          String seen = "";
                          boolean anyAttrs = false;
                          for (AudioDeviceInfo d : sorted(am, prefer)) {
                              List<AudioMixerAttributes> sup = am.getSupportedMixerAttributes(d);
                              if (sup == null || sup.isEmpty()) continue;
                              anyAttrs = true;
                              String nm = nameOf(d);
                              AudioMixerAttributes bp = null, def = null;
                              int defScore = -1;
                              for (AudioMixerAttributes a : sup) {
                                  AudioFormat f = a.getFormat();
                                  boolean isBp = a.getMixerBehavior() == AudioMixerAttributes.MIXER_BEHAVIOR_BIT_PERFECT;
                                  if (isBp) seen += nm + " " + f.getSampleRate() + "/" + encName(f.getEncoding()) + "; ";
                                  if (f.getSampleRate() != sr) continue;
                                  if (isBp) {
                                      if (f.getEncoding() == wantEnc && bp == null) bp = a;
                                  } else {
                                      int sc = (f.getEncoding() == wantEnc ? 100 : 0) + encRank(f.getEncoding());
                                      if (sc > defScore) { defScore = sc; def = a; }
                                  }
                              }
                              if (bp != null) {
                                  if (am.setPreferredMixerAttributes(attrs(), d, bp)) {
                                      lastDev = d;
                                      return new String[]{"1", "Bit-perfect: " + nm + " · " + sr + " Hz · PCM " + encName(wantEnc)};
                                  }
                              }
                              if (def != null) {
                                  if (am.setPreferredMixerAttributes(attrs(), d, def)) {
                                      lastDev = d;
                                      return new String[]{"2", "Микшер на " + sr + " Hz (PCM " + encName(def.getFormat().getEncoding()) + ") без ресемплинга. Bit-perfect этот ЦАП не даёт" + (seen.length() > 0 ? "" : " (производитель телефона его не включил)")};
                                  }
                              }
                          }
                          if (!anyAttrs) return new String[]{"0", "Нет выхода с настройкой микшера (нужен USB-ЦАП и Android 14+)"};
                          return new String[]{"0", "Частота " + sr + " Hz не поддерживается выходом. Bit-perfect: " + (seen.length() > 0 ? seen : "нет")};
                      } catch (Throwable e) {
                          return new String[]{"0", "Bit-perfect ошибка: " + e};
                      }
                  }

                  static String[] list(AudioManager am, AudioDeviceInfo d) {
                      StringBuilder bp = new StringBuilder(), mix = new StringBuilder();
                      try {
                          List<AudioMixerAttributes> sup = am.getSupportedMixerAttributes(d);
                          if (sup != null) {
                              for (AudioMixerAttributes a : sup) {
                                  AudioFormat f = a.getFormat();
                                  String s = f.getSampleRate() + "/" + encName(f.getEncoding());
                                  if (a.getMixerBehavior() == AudioMixerAttributes.MIXER_BEHAVIOR_BIT_PERFECT) {
                                      if (bp.length() > 0) bp.append(" ");
                                      bp.append(s);
                                  } else {
                                      if (mix.length() > 0) mix.append(" ");
                                      mix.append(s);
                                  }
                              }
                          }
                      } catch (Throwable t) { }
                      return new String[]{bp.toString(), mix.toString()};
                  }

                  static void clear(Context c) {
                      try {
                          if (lastDev == null) return;
                          AudioManager am = (AudioManager) c.getSystemService(Context.AUDIO_SERVICE);
                          if (am != null) am.clearPreferredMixerAttributes(attrs(), lastDev);
                      } catch (Throwable t) { }
                      lastDev = null;
                  }

                  static String[] describe(Context c) {
                      List<String> out = new ArrayList<String>();
                      try {
                          AudioManager am = (AudioManager) c.getSystemService(Context.AUDIO_SERVICE);
                          for (AudioDeviceInfo d : sorted(am, "")) {
                              String nm = d.getProductName() == null ? "—" : d.getProductName().toString();
                              String s = "Выход: " + nm + " (тип " + d.getType() + ")";
                              List<AudioMixerAttributes> sup = am.getSupportedMixerAttributes(d);
                              if (sup != null && !sup.isEmpty()) {
                                  s += " · bit-perfect:";
                                  for (AudioMixerAttributes a : sup) {
                                      if (a.getMixerBehavior() != AudioMixerAttributes.MIXER_BEHAVIOR_BIT_PERFECT) continue;
                                      AudioFormat f = a.getFormat();
                                      s += " " + f.getSampleRate() + "/" + encName(f.getEncoding());
                                  }
                              } else {
                                  s += " · bit-perfect нет";
                              }
                              out.add(s);
                          }
                      } catch (Throwable e) {
                          out.add("describe ошибка: " + e);
                      }
                      return out.toArray(new String[0]);
                  }
              }
          }
