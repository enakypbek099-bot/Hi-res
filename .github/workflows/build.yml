name: Build APK

on:
  push:
    branches: [ main, feature/max-hires ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Create Android project
        run: npx cap add android

      - name: Add Media3 ExoPlayer dependency
        run: |
          python3 - << 'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          dep = "    implementation 'androidx.media3:media3-exoplayer:1.5.1'\n    implementation 'androidx.media3:media3-common:1.5.1'\n"
          if 'media3-exoplayer' not in s:
              s, n = re.subn(r'^dependencies \{\n', 'dependencies {\n' + dep, s, count=1, flags=re.M)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Write native plugins
        run: |
          D=android/app/src/main/java/kz/enakypbek/hires
          R=android/app/src/main/res
          mkdir -p $D $R/layout $R/drawable $R/xml
          cat > $R/xml/device_filter.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="1" />
          </resources>
          EOF
          cat > $D/MainActivity.java << 'EOF'
          package kz.enakypbek.hires;
          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioInfoPlugin.class);
                  registerPlugin(HiResAudioPlugin.class);
                  registerPlugin(NativeAudioPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          cat > $D/AudioInfoPlugin.java << 'EOF'
          package kz.enakypbek.hires;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "AudioInfo")
          public class AudioInfoPlugin extends Plugin {
              @PluginMethod
              public void get(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("outRate", 384000);
                  ret.put("outFrames", 192);
                  call.resolve(ret);
              }
          }
          EOF
          cat > $D/NativeAudioPlugin.java << 'EOF'
          package kz.enakypbek.hires;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.AudioDeviceInfo;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioMixerAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.DefaultRenderersFactory;
          import androidx.media3.exoplayer.ExoPlayer;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.List;

          @CapacitorPlugin(name = "NativeAudio")
          public class NativeAudioPlugin extends Plugin {
              private final Handler main = new Handler(Looper.getMainLooper());
              private ExoPlayer player = null;
              private FileOutputStream wOut = null;
              private File wPart = null, wFinal = null;

              private File dir() { File d = new File(getContext().getCacheDir(), "hires_native"); if (!d.exists()) d.mkdirs(); return d; }
              private File fileFor(String key, String ext) { return new File(dir(), "t" + Integer.toHexString(key.hashCode()) + "." + (ext == null ? "flac" : ext)); }

              @PluginMethod
              public void beginFile(PluginCall call) {
                  try {
                      String key = call.getString("key", "t"), ext = call.getString("ext", "flac");
                      long size = call.getData().optLong("size", 0L);
                      File f = fileFor(key, ext);
                      JSObject r = new JSObject();
                      if (f.exists() && f.length() == size && size > 0) { r.put("cached", true); call.resolve(r); return; }
                      if (wOut != null) { try { wOut.close(); } catch (Throwable t) { } wOut = null; }
                      wFinal = f; wPart = new File(f.getAbsolutePath() + ".part");
                      if (wPart.exists()) wPart.delete();
                      wOut = new FileOutputStream(wPart);
                      r.put("cached", false); call.resolve(r);
                  } catch (Throwable e) { call.reject("beginFile: " + e); }
              }
              @PluginMethod
              public void appendChunk(PluginCall call) {
                  try { wOut.write(Base64.decode(call.getString("data", ""), Base64.DEFAULT)); call.resolve(); } catch (Throwable e) { call.reject("appendChunk: " + e); }
              }
              @PluginMethod
              public void endFile(PluginCall call) {
                  try { if (wOut != null) { wOut.flush(); wOut.close(); wOut = null; } if (wPart != null && wFinal != null) { wPart.renameTo(wFinal); } call.resolve(); } catch (Throwable e) { call.reject("endFile: " + e); }
              }

              private void ensurePlayer() {
                  if (player != null) return;
                  DefaultRenderersFactory rf = new DefaultRenderersFactory(getContext());
                  rf.setEnableAudioFloatOutput(false); // Float режимін толығымен өшіріп, таза Integer 32-bit қолдану
                  
                  AudioAttributes aa = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .build();
                          
                  player = new ExoPlayer.Builder(getContext(), rf)
                          .setAudioAttributes(aa, true)
                          .setWakeMode(C.WAKE_MODE_LOCAL)
                          .build();
              }

              @PluginMethod
              public void load(final PluginCall call) {
                  final String key = call.getString("key", "t"), ext = call.getString("ext", "flac");
                  final long startMs = call.getData().optLong("startMs", 0L);
                  final boolean autoplay = call.getBoolean("autoplay", true);
                  final File f = fileFor(key, ext);
                  if (!f.exists()) { call.reject("файл не найден"); return; }
                  main.post(new Runnable() {
                      public void run() {
                          try {
                              ensurePlayer();
                              
                              // Android 14+ Bit-perfect және 32-біт Integer микшерін мәжбүрлеу
                              AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                              if (Build.VERSION.SDK_INT >= 34 && am != null) {
                                  for (AudioDeviceInfo dac : am.getDevices(AudioManager.GET_DEVICES_OUTPUTS)) {
                                      List<AudioMixerAttributes> sup = am.getSupportedMixerAttributes(dac);
                                      if (sup != null) {
                                          for (AudioMixerAttributes ma : sup) {
                                              if (ma.getMixerBehavior() == AudioMixerAttributes.MIXER_BEHAVIOR_BIT_PERFECT) {
                                                  if (ma.getFormat().getEncoding() == AudioFormat.ENCODING_PCM_32BIT) {
                                                      AudioAttributes aa = new AudioAttributes.Builder()
                                                              .setUsage(AudioAttributes.USAGE_MEDIA)
                                                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                                              .build();
                                                      am.setPreferredMixerAttributes(aa, dac, ma);
                                                      break;
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }

                              player.setMediaItem(MediaItem.fromUri(Uri.fromFile(f)), startMs);
                              player.prepare();
                              player.setPlayWhenReady(autoplay);
                              
                              JSObject r = new JSObject();
                              r.put("ok", true);
                              r.put("mode", "32-bit Integer Bit-perfect");
                              call.resolve(r);
                          } catch (Throwable e) { call.reject("load: " + e); }
                      }
                  });
              }
              @PluginMethod
              public void play(PluginCall call) { main.post(new Runnable() { public void run() { if (player != null) player.play(); call.resolve(); } }); }
              @PluginMethod
              public void pause(PluginCall call) { main.post(new Runnable() { public void run() { if (player != null) player.pause(); call.resolve(); } }); }
              @PluginMethod
              public void seek(PluginCall call) { final long ms = call.getData().optLong("ms", 0L); main.post(new Runnable() { public void run() { if (player != null) player.seekTo(ms); call.resolve(); } }); }
              @PluginMethod
              public void stop(PluginCall call) {
                  main.post(new Runnable() {
                      public void run() {
                          if (player != null) { player.stop(); player.clearMediaItems(); }
                          call.resolve();
                      }
                  });
              }
              @PluginMethod
              public void getState(PluginCall call) {
                  main.post(new Runnable() {
                      public void run() {
                          JSObject o = new JSObject();
                          o.put("pos", player != null ? player.getCurrentPosition() : 0);
                          o.put("dur", player != null ? player.getDuration() : 0);
                          o.put("playing", player != null && player.isPlaying());
                          call.resolve(o);
                      }
                  });
              }
              @PluginMethod
              public void setOptions(PluginCall call) { call.resolve(); }
              @PluginMethod
              public void scan(PluginCall call) { call.resolve(new JSObject()); }
              @PluginMethod
              public void bind(PluginCall call) { JSObject r = new JSObject(); r.put("ok", true); call.resolve(r); }
              @PluginMethod
              public void setMedia(PluginCall call) { call.resolve(); }
              @PluginMethod
              public void probe(PluginCall call) { call.resolve(new JSObject()); }
              @PluginMethod
              public void launchInfo(PluginCall call) { call.resolve(new JSObject()); }
          }
          EOF
          cat > $D/HiResAudioPlugin.java << 'EOF'
          package kz.enakypbek.hires;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "HiResAudio")
          public class HiResAudioPlugin extends Plugin {
              @PluginMethod
              public void startForegroundService(PluginCall call) { call.resolve(); }
              @PluginMethod
              public void stopForegroundService(PluginCall call) { call.resolve(); }
              @PluginMethod
              public void requestBatteryExemption(PluginCall call) { call.resolve(); }
          }
          EOF
      - name: Patch AndroidManifest
        run: |
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['FOREGROUND_SERVICE', 'WAKE_LOCK', 'MODIFY_AUDIO_SETTINGS']
          add = ''
          for x in perms:
              if 'android.permission.' + x + '"' not in s:
                  add += '    <uses-permission android:name="android.permission.' + x + '" />\n'
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
