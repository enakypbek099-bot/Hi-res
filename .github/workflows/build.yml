name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Create Android Project & Add Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Create Native Java Plugin Files Safely
        run: |
          mkdir -p android/app/src/main/java/kz/enakypbek/hires

          # 1. MainActivity.java
          cat << 'EOF' > android/app/src/main/java/kz/enakypbek/hires/MainActivity.java
          package kz.enakypbek.hires;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(AudioInfoPlugin.class);
                  registerPlugin(HiResAudioPlugin.class);
              }
          }
          EOF

          # 2. AudioInfoPlugin.java
          cat << 'EOF' > android/app/src/main/java/kz/enakypbek/hires/AudioInfoPlugin.java
          package kz.enakypbek.hires;

          import android.content.Context;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import android.os.Build;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AudioInfo")
          public class AudioInfoPlugin extends Plugin {
              @PluginMethod
              public void get(PluginCall call) {
                  JSObject ret = new JSObject();
                  try {
                      AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                      if (am != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              String sr = am.getProperty(AudioManager.PROPERTY_OUTPUT_SAMPLE_RATE);
                              String fr = am.getProperty(AudioManager.PROPERTY_OUTPUT_FRAMES_PER_BUFFER);
                              ret.put("outRate", sr != null ? Integer.parseInt(sr) : 48000);
                              ret.put("outFrames", fr != null ? Integer.parseInt(fr) : 192);
                          } else {
                              ret.put("outRate", 48000);
                              ret.put("outFrames", 192);
                          }
                          ret.put("vol", am.getStreamVolume(AudioManager.STREAM_MUSIC));
                          ret.put("volMax", am.getStreamMaxVolume(AudioManager.STREAM_MUSIC));
                      }
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("Error: " + e.getMessage());
                  }
              }
          }
          EOF

          # 3. HiResAudioPlugin.java
          cat << 'EOF' > android/app/src/main/java/kz/enakypbek/hires/HiResAudioPlugin.java
          package kz.enakypbek.hires;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "HiResAudio")
          public class HiResAudioPlugin extends Plugin {
              private static final String CHANNEL_ID = "hires_playback_channel";
              private static PowerManager.WakeLock wakeLock = null;

              @PluginMethod
              public void startForegroundService(PluginCall call) {
                  String title = call.getString("title", "HI-RES Музыка");
                  String artist = call.getString("artist", "Lossless Playback");
                  Intent serviceIntent = new Intent(getContext(), PlaybackService.class);
                  serviceIntent.putExtra("title", title);
                  serviceIntent.putExtra("artist", artist);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      getContext().startForegroundService(serviceIntent);
                  } else {
                      getContext().startService(serviceIntent);
                  }
                  if (wakeLock == null) {
                      PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "HiRes:WakeLock");
                          wakeLock.acquire(3600000L);
                      }
                  }
                  call.resolve();
              }

              @PluginMethod
              public void stopForegroundService(PluginCall call) {
                  getContext().stopService(new Intent(getContext(), PlaybackService.class));
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                      wakeLock = null;
                  }
                  call.resolve();
              }

              public static class PlaybackService extends Service {
                  @Override
                  public void onCreate() {
                      super.onCreate();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Hi-Res Playback", NotificationManager.IMPORTANCE_LOW);
                          getSystemService(NotificationManager.class).createNotificationChannel(channel);
                      }
                  }
                  @Override
                  public int onStartCommand(Intent intent, int flags, int startId) {
                      String title = intent != null ? intent.getStringExtra("title") : "HI-RES Музыка";
                      String artist = intent != null ? intent.getStringExtra("artist") : "Lossless Playback";
                      Notification notif = new NotificationCompat.Builder(this, CHANNEL_ID)
                              .setContentTitle(title)
                              .setContentText(artist)
                              .setSmallIcon(android.R.drawable.ic_media_play)
                              .build();
                      startForeground(1, notif);
                      return START_STICKY;
                  }
                  @Override
                  public IBinder onBind(Intent intent) { return null; }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
