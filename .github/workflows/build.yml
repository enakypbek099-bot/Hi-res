name: Build APK

on:
  push:
    branches: [ main, feature/max-hires ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Create Android project
        run: npx cap add android

      - name: Add Media3 ExoPlayer dependency
        run: |
          python3 - << 'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          dep = "    implementation 'androidx.media3:media3-exoplayer:1.5.1'\n    implementation 'androidx.media3:media3-common:1.5.1'\n"
          if 'media3-exoplayer' not in s:
              s, n = re.subn(r'^dependencies \{\n', 'dependencies {\n' + dep, s, count=1, flags=re.M)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Write native plugins
        run: |
          D=android/app/src/main/java/kz/enakypbek/hires
          R=android/app/src/main/res
          mkdir -p $D $R/layout $R/drawable $R/xml
          cat > $R/xml/device_filter.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="1" />
          </resources>
          EOF
          cat > $D/MainActivity.java << 'EOF'
          package kz.enakypbek.hires;
          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioInfoPlugin.class);
                  registerPlugin(HiResAudioPlugin.class);
                  registerPlugin(NativeAudioPlugin.class);
                  super.onCreate(savedInstanceState);
                  NativeAudioPlugin.onUsbIntent(getIntent());
              }
              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  NativeAudioPlugin.onUsbIntent(intent);
              }
          }
          EOF
          cat > $D/AudioInfoPlugin.java << 'EOF'
          package kz.enakypbek.hires;
          import android.content.Context;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "AudioInfo")
          public class AudioInfoPlugin extends Plugin {
              @PluginMethod
              public void get(PluginCall call) {
                  JSObject ret = new JSObject();
                  try {
                      AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                      if (am != null) {
                          String sr = am.getProperty(AudioManager.PROPERTY_OUTPUT_SAMPLE_RATE);
                          String fr = am.getProperty(AudioManager.PROPERTY_OUTPUT_FRAMES_PER_BUFFER);
                          ret.put("outRate", sr != null ? Integer.parseInt(sr) : 48000);
                          ret.put("outFrames", fr != null ? Integer.parseInt(fr) : 192);
                          ret.put("vol", am.getStreamVolume(AudioManager.STREAM_MUSIC));
                          ret.put("volMax", am.getStreamMaxVolume(AudioManager.STREAM_MUSIC));
                      }
                      call.resolve(ret);
                  } catch (Exception e) { call.reject("AudioInfo: " + e.getMessage()); }
              }
          }
          EOF
          cat > $D/NativeAudioPlugin.java << 'EOF'
          package kz.enakypbek.hires;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.AudioDeviceInfo;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioMixerAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import androidx.media3.common.C;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.DefaultRenderersFactory;
          import androidx.media3.exoplayer.ExoPlayer;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.List;

          @CapacitorPlugin(name = "NativeAudio")
          public class NativeAudioPlugin extends Plugin {
              private final Handler main = new Handler(Looper.getMainLooper());
              private ExoPlayer player = null;
              private static NativeAudioPlugin inst = null;
              static volatile boolean usbLaunch = false;
              private String boundName = "";
              private FileOutputStream wOut = null;
              private File wPart = null, wFinal = null;

              @Override
              public void load() {
                  inst = this;
                  try {
                      android.content.SharedPreferences sp = getContext().getSharedPreferences("hires_dac", 0);
                      boundName = sp.getString("bound", "");
                  } catch (Throwable t) { }
              }
              static void onUsbIntent(Intent i) {
                  try { if (i != null && android.hardware.usb.UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(i.getAction())) { usbLaunch = true; if (inst != null) inst.emit("usb", "", 0); } } catch (Throwable t) { }
              }
              private static boolean isUsb(int t) { return t == AudioDeviceInfo.TYPE_USB_DEVICE || t == AudioDeviceInfo.TYPE_USB_HEADSET || t == AudioDeviceInfo.TYPE_USB_ACCESSORY; }
              private static String nameOf(AudioDeviceInfo d) { CharSequence n = d.getProductName(); return n == null ? "USB" : n.toString(); }
              private AudioManager audioMgr() { return (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE); }
              private static AudioDeviceInfo findDac(AudioManager am, String prefer) {
                  AudioDeviceInfo first = null;
                  for (AudioDeviceInfo d : am.getDevices(AudioManager.GET_DEVICES_OUTPUTS)) {
                      if (!d.isSink() || !isUsb(d.getType())) continue;
                      if (prefer != null && prefer.length() > 0 && prefer.equals(nameOf(d))) return d;
                      if (first == null) first = d;
                  }
                  return first;
              }
              private void emit(String type, String msg, long val) {
                  try { JSObject o = new JSObject(); o.put("t", type); o.put("msg", msg == null ? "" : msg); o.put("val", val); notifyListeners("native", o); } catch (Throwable t) { }
              }
              private File dir() { File d = new File(getContext().getCacheDir(), "hires_native"); if (!d.exists()) d.mkdirs(); return d; }
              private File fileFor(String key, String ext) { return new File(dir(), "t" + Integer.toHexString(key.hashCode()) + "." + (ext == null ? "flac" : ext)); }

              @PluginMethod
              public void beginFile(PluginCall call) {
                  try {
                      String key = call.getString("key", "t"), ext = call.getString("ext", "flac");
                      long size = call.getData().optLong("size", 0L);
                      File f = fileFor(key, ext);
                      JSObject r = new JSObject();
                      if (f.exists() && f.length() == size && size > 0) { r.put("cached", true); call.resolve(r); return; }
                      if (wOut != null) { try { wOut.close(); } catch (Throwable t) { } wOut = null; }
                      wFinal = f; wPart = new File(f.getAbsolutePath() + ".part");
                      if (wPart.exists()) wPart.delete();
                      wOut = new FileOutputStream(wPart);
                      r.put("cached", false); call.resolve(r);
                  } catch (Throwable e) { call.reject("beginFile: " + e); }
              }
              @PluginMethod
              public void appendChunk(PluginCall call) {
                  try { wOut.write(Base64.decode(call.getString("data", ""), Base64.DEFAULT)); call.resolve(); } catch (Throwable e) { call.reject("appendChunk: " + e); }
              }
              @PluginMethod
              public void endFile(PluginCall call) {
                  try { if (wOut != null) { wOut.flush(); wOut.close(); wOut = null; } if (wPart != null && wFinal != null) { wPart.renameTo(wFinal); } call.resolve(); } catch (Throwable e) { call.reject("endFile: " + e); }
              }

              private void ensurePlayer() {
                  if (player != null) return;
                  DefaultRenderersFactory rf = new DefaultRenderersFactory(getContext());
                  rf.setEnableAudioFloatOutput(false); // Float өшіріліп, таза Integer (PCM 32-bit) қолданылады
                  AudioAttributes aa = new AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MUSIC).build();
                  player = new ExoPlayer.Builder(getContext(), rf).setAudioAttributes(aa, true).setWakeMode(C.WAKE_MODE_LOCAL).build();
              }

              @PluginMethod
              public void load(final PluginCall call) {
                  final String key = call.getString("key", "t"), ext = call.getString("ext", "flac");
                  final long startMs = call.getData().optLong("startMs", 0L);
                  final boolean autoplay = call.getBoolean("autoplay", true);
                  final File f = fileFor(key, ext);
                  if (!f.exists()) { call.reject("файл не найден"); return; }
                  main.post(new Runnable() {
                      public void run() {
                          try {
                              ensurePlayer();
                              AudioManager am = audioMgr();
                              AudioDeviceInfo dac = am == null ? null : findDac(am, boundName);
                              String bpMsg = "";
                              boolean bpOk = false;
                              // Android 14+ микшеріне таза 32-бит Integer (ENCODING_PCM_32BIT) беру
                              if (Build.VERSION.SDK_INT >= 34) {
                                  String[] r = Bp.applyMax32Bit(getContext(), dac);
                                  bpOk = "1".equals(r[0]);
                                  bpMsg = r[1];
                              }
                              player.setMediaItem(MediaItem.fromUri(Uri.fromFile(f)), startMs);
                              player.prepare();
                              player.setPlayWhenReady(autoplay);
                              JSObject r = new JSObject();
                              r.put("bpOk", bpOk);
                              r.put("dac", dac == null ? "" : nameOf(dac));
                              r.put("bpMsg", bpMsg);
                              r.put("float", false);
                              call.resolve(r);
                          } catch (Throwable e) { call.reject("load: " + e); }
                      }
                  });
              }
              @PluginMethod
              public void play(PluginCall call) { main.post(new Runnable() { public void run() { if (player != null) player.play(); call.resolve(); } }); }
              @PluginMethod
              public void pause(PluginCall call) { main.post(new Runnable() { public void run() { if (player != null) player.pause(); call.resolve(); } }); }
              @PluginMethod
              public void seek(PluginCall call) { final long ms = call.getData().optLong("ms", 0L); main.post(new Runnable() { public void run() { if (player != null) player.seekTo(ms); call.resolve(); } }); }
              @PluginMethod
              public void stop(PluginCall call) { main.post(new Runnable() { public void run() { if (player != null) { player.stop(); player.clearMediaItems(); } if (Build.VERSION.SDK_INT >= 34) Bp.clear(getContext()); call.resolve(); } }); }
              @PluginMethod
              public void getState(PluginCall call) {
                  main.post(new Runnable() {
                      public void run() {
                          JSObject o = new JSObject();
                          o.put("pos", player != null ? player.getCurrentPosition() : 0);
                          o.put("dur", player != null ? player.getDuration() : 0);
                          o.put("playing", player != null && player.isPlaying());
                          call.resolve(o);
                      }
                  });
              }
              @PluginMethod
              public void setOptions(PluginCall call) { call.resolve(); }
              @PluginMethod
              public void scan(PluginCall call) { call.resolve(new JSObject()); }
              @PluginMethod
              public void bind(PluginCall call) { JSObject r = new JSObject(); r.put("ok", true); call.resolve(r); }
              @PluginMethod
              public void setMedia(PluginCall call) { call.resolve(); }
              @PluginMethod
              public void probe(PluginCall call) { call.resolve(new JSObject()); }
              @PluginMethod
              public void launchInfo(PluginCall call) { JSObject r = new JSObject(); r.put("usb", usbLaunch); usbLaunch = false; call.resolve(r); }

              static class Bp {
                  static AudioDeviceInfo lastDev = null;
                  static AudioAttributes attrs() { return new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build(); }
                  static String[] applyMax32Bit(Context c, AudioDeviceInfo dac) {
                      try {
                          AudioManager am = (AudioManager) c.getSystemService(Context.AUDIO_SERVICE);
                          if (am == null || dac == null) return new String[]{"0", "ЦАП табылмады"};
                          List<AudioMixerAttributes> sup = am.getSupportedMixerAttributes(dac);
                          if (sup == null || sup.isEmpty()) return new String[]{"0", "Bit-perfect жоқ"};
                          AudioMixerAttributes best = null;
                          int maxRate = 0;
                          for (AudioMixerAttributes a : sup) {
                              if (a.getMixerBehavior() == AudioMixerAttributes.MIXER_BEHAVIOR_BIT_PERFECT) {
                                  int enc = a.getFormat().getEncoding();
                                  // Таза 32-бит integer немесе ең жоғарғы қолжетімді integer іздейміз
                                  if (enc == AudioFormat.ENCODING_PCM_32BIT || enc == AudioFormat.ENCODING_PCM_24BIT_PACKED) {
                                      int sr = a.getFormat().getSampleRate();
                                      if (sr >= maxRate) { maxRate = sr; best = a; }
                                  }
                              }
                          }
                          // Егер 32/24 бит таппаса, кез келген Bit-perfect таңдаймыз
                          if (best == null) {
                              for (AudioMixerAttributes a : sup) {
                                  if (a.getMixerBehavior() == AudioMixerAttributes.MIXER_BEHAVIOR_BIT_PERFECT) {
                                      int sr = a.getFormat().getSampleRate();
                                      if (sr >= maxRate) { maxRate = sr; best = a; }
                                  }
                              }
                          }
                          if (best != null) {
                              am.setPreferredMixerAttributes(attrs(), dac, best);
                              lastDev = dac;
                              return new String[]{"1", "Bit-perfect 32-bit Integer: " + best.getFormat().getSampleRate() + " Hz"};
                          }
                      } catch (Throwable t) { }
                      return new String[]{"0", "Режим орнатылмады"};
                  }
                  static void clear(Context c) {
                      try { if (lastDev != null) { AudioManager am = (AudioManager) c.getSystemService(Context.AUDIO_SERVICE); if (am != null) am.clearPreferredMixerAttributes(attrs(), lastDev); } } catch (Throwable t) { }
                      lastDev = null;
                  }
              }
          }
          EOF
          cat > $D/HiResAudioPlugin.java << 'EOF'
          package kz.enakypbek.hires;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "HiResAudio")
          public class HiResAudioPlugin extends Plugin {
              @PluginMethod
              public void startForegroundService(PluginCall call) { call.resolve(); }
              @PluginMethod
              public void stopForegroundService(PluginCall call) { call.resolve(); }
              @PluginMethod
              public void requestBatteryExemption(PluginCall call) { call.resolve(); }
          }
          EOF
      - name: Patch AndroidManifest
        run: |
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['FOREGROUND_SERVICE', 'WAKE_LOCK', 'MODIFY_AUDIO_SETTINGS']
          add = ''
          for x in perms:
              if 'android.permission.' + x + '"' not in s:
                  add += '    <uses-permission android:name="android.permission.' + x + '" />\n'
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
