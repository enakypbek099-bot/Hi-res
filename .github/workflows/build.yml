      - name: Patch AndroidManifest
        run: |
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          svc = '<service android:name="kz.enakypbek.hires.HiResAudioPlugin$PlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    '
          rcv = '<receiver android:name="kz.enakypbek.hires.HiResAudioPlugin$NotifReceiver" android:exported="false" />\n    '
          if 'PlaybackService' not in s:
              s = s.replace('</application>', svc + rcv + '</application>')
          perms = ['FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'POST_NOTIFICATIONS', 'WAKE_LOCK', 'MODIFY_AUDIO_SETTINGS', 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS']
          add = ''
          for x in perms:
              if 'android.permission.' + x + '"' not in s:
                  add += '    <uses-permission android:name="android.permission.' + x + '" />\n'
          s = s.replace('</manifest>', add + '</manifest>')
          if 'USB_DEVICE_ATTACHED' not in s:
              ifl = '<intent-filter>\n                <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />\n            </intent-filter>\n            <meta-data android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" android:resource="@xml/device_filter" />\n        '
              s = s.replace('</activity>', ifl + '</activity>', 1)
          if 'android.hardware.usb.host' not in s:
              s = s.replace('<application', '<uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "PlaybackService\|permission\|USB_DEVICE\|usb.host" android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
