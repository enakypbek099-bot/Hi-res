name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Create Android project
        run: npx cap add android

      - name: Write native plugins
        run: |
          D=android/app/src/main/java/kz/enakypbek/hires
          R=android/app/src/main/res
          mkdir -p $D $R/layout $R/drawable
          cat > $D/MainActivity.java << 'EOF'
          package kz.enakypbek.hires;

          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AudioInfoPlugin.class);
                  registerPlugin(HiResAudioPlugin.class);
                  super.onCreate(savedInstanceState);
              }

              private void keepAlive() {
                  try {
                      WebView w = getBridge().getWebView();
                      if (w != null) {
                          w.onResume();
                          w.resumeTimers();
                      }
                  } catch (Exception e) { }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  keepAlive();
              }

              @Override
              public void onStop() {
                  super.onStop();
                  keepAlive();
              }
          }
          EOF
          cat > $D/AudioInfoPlugin.java << 'EOF'
          package kz.enakypbek.hires;

          import android.content.Context;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import android.os.Build;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AudioInfo")
          public class AudioInfoPlugin extends Plugin {

              private static String kindOf(int t) {
                  switch (t) {
                      case 7: case 8: case 26: case 27: return "bt";
                      case 3: case 4: case 5: case 6: case 11: case 22: return "wired";
                      case 1: case 2: return "spk";
                      default: return "other";
                  }
              }

              private static int rank(int t) {
                  switch (t) {
                      case 11: case 22: return 5;
                      case 3: case 4: case 5: case 6: return 4;
                      case 8: case 26: case 27: return 3;
                      case 7: return 2;
                      case 9: return 2;
                      case 2: return 1;
                      default: return 0;
                  }
              }

              @PluginMethod
              public void get(PluginCall call) {
                  JSObject ret = new JSObject();
                  try {
                      AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                      if (am != null) {
                          String sr = am.getProperty(AudioManager.PROPERTY_OUTPUT_SAMPLE_RATE);
                          String fr = am.getProperty(AudioManager.PROPERTY_OUTPUT_FRAMES_PER_BUFFER);
                          ret.put("outRate", sr != null ? Integer.parseInt(sr) : 48000);
                          ret.put("outFrames", fr != null ? Integer.parseInt(fr) : 192);
                          ret.put("vol", am.getStreamVolume(AudioManager.STREAM_MUSIC));
                          ret.put("volMax", am.getStreamMaxVolume(AudioManager.STREAM_MUSIC));

                          AudioDeviceInfo best = null;
                          AudioDeviceInfo[] outs = am.getDevices(AudioManager.GET_DEVICES_OUTPUTS);
                          for (AudioDeviceInfo d : outs) {
                              if (best == null || rank(d.getType()) > rank(best.getType())) best = d;
                          }
                          if (best != null) {
                              JSObject dev = new JSObject();
                              CharSequence nm = best.getProductName();
                              dev.put("name", nm != null ? nm.toString() : "");
                              dev.put("type", best.getType());
                              dev.put("kind", kindOf(best.getType()));
                              JSArray rates = new JSArray();
                              for (int x : best.getSampleRates()) rates.put(x);
                              JSArray enc = new JSArray();
                              for (int x : best.getEncodings()) enc.put(x);
                              JSArray ch = new JSArray();
                              for (int x : best.getChannelCounts()) ch.put(x);
                              dev.put("rates", rates);
                              dev.put("enc", enc);
                              dev.put("ch", ch);
                              ret.put("dev", dev);
                          }
                      }
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("AudioInfo: " + e.getMessage());
                  }
              }
          }
          EOF
          cat > $D/HiResAudioPlugin.java << 'EOF'
          package kz.enakypbek.hires;

          import android.Manifest;
          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.PorterDuff;
          import android.graphics.PorterDuffXfermode;
          import android.graphics.RectF;
          import android.net.Uri;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.util.Base64;
          import android.webkit.WebView;
          import android.widget.RemoteViews;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "HiResAudio")
          public class HiResAudioPlugin extends Plugin {
              static final String CHANNEL_ID = "hires_playback_channel";
              static final String A_PREV = "kz.enakypbek.hires.PREV";
              static final String A_PLAY = "kz.enakypbek.hires.PLAY";
              static final String A_NEXT = "kz.enakypbek.hires.NEXT";
              private static PowerManager.WakeLock wakeLock = null;
              private static HiResAudioPlugin inst = null;
              private static Bitmap lastArt = null;
              private static String lastTitle = "HI-RES";
              private static String lastArtist = "";
              private static boolean lastPlaying = true;

              @Override
              public void load() {
                  inst = this;
              }

              static void emit(final String action) {
                  try {
                      final HiResAudioPlugin p = inst;
                      if (p == null || p.getActivity() == null) return;
                      final String js = "window.dispatchEvent(new CustomEvent('hiresAction',{detail:'" + action + "'}))";
                      p.getActivity().runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  WebView w = p.getBridge().getWebView();
                                  if (w != null) w.evaluateJavascript(js, null);
                              } catch (Exception e) { }
                          }
                      });
                  } catch (Exception e) { }
              }

              @PluginMethod
              public void startForegroundService(PluginCall call) {
                  try {
                      String title = call.getString("title", "HI-RES");
                      String artist = call.getString("artist", "");
                      String art = call.getString("art", "");
                      boolean playing = call.getBoolean("playing", true);
                      if (Build.VERSION.SDK_INT >= 33 && getActivity() != null
                              && ContextCompat.checkSelfPermission(getContext(), Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(getActivity(), new String[]{Manifest.permission.POST_NOTIFICATIONS}, 77);
                      }
                      Intent si = new Intent(getContext(), PlaybackService.class);
                      si.putExtra("title", title);
                      si.putExtra("artist", artist);
                      si.putExtra("art", art);
                      si.putExtra("playing", playing);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getContext().startForegroundService(si);
                      } else {
                          getContext().startService(si);
                      }
                      PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                      if (playing) {
                          if (wakeLock == null && pm != null) {
                              wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "HiRes:WakeLock");
                              wakeLock.acquire(6 * 60 * 60 * 1000L);
                          }
                      } else if (wakeLock != null) {
                          if (wakeLock.isHeld()) wakeLock.release();
                          wakeLock = null;
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("HiResAudio: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void stopForegroundService(PluginCall call) {
                  try {
                      getContext().stopService(new Intent(getContext(), PlaybackService.class));
                      if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                      wakeLock = null;
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("HiResAudio: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void requestBatteryExemption(PluginCall call) {
                  try {
                      PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                      String pkg = getContext().getPackageName();
                      if (Build.VERSION.SDK_INT >= 23 && pm != null && !pm.isIgnoringBatteryOptimizations(pkg)) {
                          Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + pkg));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.resolve();
                  }
              }

              public static class NotifReceiver extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context ctx, Intent intent) {
                      String a = intent.getAction();
                      if (A_PREV.equals(a)) emit("prev");
                      else if (A_PLAY.equals(a)) emit("play");
                      else if (A_NEXT.equals(a)) emit("next");
                  }
              }

              static Bitmap roundArt(String b64) {
                  try {
                      byte[] d = Base64.decode(b64, Base64.DEFAULT);
                      Bitmap src = BitmapFactory.decodeByteArray(d, 0, d.length);
                      if (src == null) return null;
                      int s = Math.min(src.getWidth(), src.getHeight());
                      Bitmap out = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(out);
                      Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                      c.drawRoundRect(new RectF(0, 0, s, s), s * 0.18f, s * 0.18f, p);
                      p.setXfermode(new PorterDuffXfermode(PorterDuff.Mode.SRC_IN));
                      c.drawBitmap(src, (s - src.getWidth()) / 2f, (s - src.getHeight()) / 2f, p);
                      return out;
                  } catch (Throwable t) {
                      return null;
                  }
              }

              public static class PlaybackService extends Service {
                  @Override
                  public void onCreate() {
                      super.onCreate();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Hi-Res Playback", NotificationManager.IMPORTANCE_LOW);
                          ch.setShowBadge(false);
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(ch);
                      }
                  }

                  private PendingIntent act(String a, int rc) {
                      Intent i = new Intent(this, NotifReceiver.class);
                      i.setAction(a);
                      return PendingIntent.getBroadcast(this, rc, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  }

                  @Override
                  public int onStartCommand(Intent intent, int flags, int startId) {
                      if (intent != null) {
                          String t = intent.getStringExtra("title");
                          String a = intent.getStringExtra("artist");
                          String art = intent.getStringExtra("art");
                          if (t != null) lastTitle = t;
                          if (a != null) lastArtist = a;
                          lastPlaying = intent.getBooleanExtra("playing", true);
                          if (art != null && art.length() > 20) {
                              Bitmap b = roundArt(art);
                              if (b != null) lastArt = b;
                          }
                      }
                      RemoteViews rv = new RemoteViews(getPackageName(), R.layout.notif_hires);
                      rv.setTextViewText(R.id.n_title, lastTitle);
                      rv.setTextViewText(R.id.n_artist, lastArtist);
                      if (lastArt != null) rv.setImageViewBitmap(R.id.n_art, lastArt);
                      else rv.setImageViewResource(R.id.n_art, R.drawable.ic_play);
                      rv.setImageViewResource(R.id.n_play, lastPlaying ? R.drawable.ic_pause : R.drawable.ic_play);
                      rv.setOnClickPendingIntent(R.id.n_prev, act(A_PREV, 1));
                      rv.setOnClickPendingIntent(R.id.n_play, act(A_PLAY, 2));
                      rv.setOnClickPendingIntent(R.id.n_next, act(A_NEXT, 3));

                      Intent open = getPackageManager().getLaunchIntentForPackage(getPackageName());
                      PendingIntent openPi = open == null ? null
                              : PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                      NotificationCompat.Builder nb = new NotificationCompat.Builder(this, CHANNEL_ID)
                              .setSmallIcon(android.R.drawable.ic_media_play)
                              .setStyle(new NotificationCompat.DecoratedCustomViewStyle())
                              .setCustomContentView(rv)
                              .setCustomBigContentView(rv)
                              .setContentTitle(lastTitle)
                              .setContentText(lastArtist)
                              .setOngoing(lastPlaying)
                              .setOnlyAlertOnce(true)
                              .setSilent(true)
                              .setCategory(NotificationCompat.CATEGORY_TRANSPORT)
                              .setVisibility(NotificationCompat.VISIBILITY_PUBLIC);
                      if (openPi != null) nb.setContentIntent(openPi);
                      Notification n = nb.build();
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      } else {
                          startForeground(1, n);
                      }
                      return START_STICKY;
                  }

                  @Override
                  public void onTaskRemoved(Intent rootIntent) {
                      stopSelf();
                      super.onTaskRemoved(rootIntent);
                  }

                  @Override
                  public IBinder onBind(Intent intent) { return null; }
              }
          }
          EOF
          cat > $R/layout/notif_hires.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:padding="6dp"
              android:background="@drawable/glass_bg">

              <ImageView
                  android:id="@+id/n_art"
                  android:layout_width="52dp"
                  android:layout_height="52dp"
                  android:scaleType="centerCrop" />

              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:layout_marginStart="10dp"
                  android:layout_marginEnd="6dp"
                  android:orientation="vertical">

                  <TextView
                      android:id="@+id/n_title"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:singleLine="true"
                      android:ellipsize="end"
                      android:textColor="#FFFFFFFF"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/n_artist"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:singleLine="true"
                      android:ellipsize="end"
                      android:textColor="#B3FFFFFF"
                      android:textSize="12sp" />
              </LinearLayout>

              <ImageButton
                  android:id="@+id/n_prev"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:background="@drawable/glass_btn"
                  android:src="@drawable/ic_prev"
                  android:contentDescription="prev" />

              <ImageButton
                  android:id="@+id/n_play"
                  android:layout_width="44dp"
                  android:layout_height="44dp"
                  android:layout_marginStart="6dp"
                  android:layout_marginEnd="6dp"
                  android:background="@drawable/glass_btn_main"
                  android:src="@drawable/ic_pause"
                  android:contentDescription="play" />

              <ImageButton
                  android:id="@+id/n_next"
                  android:layout_width="38dp"
                  android:layout_height="38dp"
                  android:background="@drawable/glass_btn"
                  android:src="@drawable/ic_next"
                  android:contentDescription="next" />
          </LinearLayout>
          EOF
          cat > $R/drawable/glass_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:angle="0" android:startColor="#FF232C73" android:endColor="#FF0D0A24" />
          </shape>
          EOF
          cat > $R/drawable/glass_btn.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:angle="270" android:startColor="#44FFFFFF" android:endColor="#14FFFFFF" />
              <stroke android:width="1dp" android:color="#66FFFFFF" />
          </shape>
          EOF
          cat > $R/drawable/glass_btn_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient android:angle="270" android:startColor="#886EE7B7" android:endColor="#2A6EE7B7" />
              <stroke android:width="1.5dp" android:color="#AA6EE7B7" />
          </shape>
          EOF
          cat > $R/drawable/ic_play.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M8,5v14l11,-7z" />
          </vector>
          EOF
          cat > $R/drawable/ic_pause.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M6,19h4V5H6v14zM14,5v14h4V5h-4z" />
          </vector>
          EOF
          cat > $R/drawable/ic_prev.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M6,6h2v12H6zM9.5,12l8.5,6V6z" />
          </vector>
          EOF
          cat > $R/drawable/ic_next.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M6,18l8.5,-6L6,6v12zM16,6v12h2V6h-2z" />
          </vector>
          EOF

      - name: Patch AndroidManifest
        run: |
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          svc = '<service android:name="kz.enakypbek.hires.HiResAudioPlugin$PlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    '
          rcv = '<receiver android:name="kz.enakypbek.hires.HiResAudioPlugin$NotifReceiver" android:exported="false" />\n    '
          if 'PlaybackService' not in s:
              s = s.replace('</application>', svc + rcv + '</application>')
          perms = ['FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'POST_NOTIFICATIONS', 'WAKE_LOCK', 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS']
          add = ''
          for x in perms:
              if 'android.permission.' + x + '"' not in s:
                  add += '    <uses-permission android:name="android.permission.' + x + '" />\n'
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "PlaybackService\|permission" android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
